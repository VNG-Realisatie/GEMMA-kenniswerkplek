[project]
name = "llmwiki"
version = "0.1.0"
description = "Deterministisch gereedschap voor de LLM-wiki monorepo (zie ARCHITECTURE.md)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/llmwiki"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
mediawiki = [
    "pywikibot>=9.0",
]
pdf = [
    "pymupdf4llm>=0.0.17",
]

[tool.uv]
# Alles standaard installeren: een gewone `uv sync` haalt dan niets weg.
default-groups = ["dev", "mediawiki", "pdf"]

# mwparserfromhell (via pywikibot) heeft niet voor elke Python-versie een kant-en-klaar pakket; bouwen vraagt
# dan een C-compiler. WITH_EXTENSION=0 bouwt de variant in puur Python. Zodra er een kant-en-klaar pakket is,
# gebruikt uv dat en doet deze instelling niets.
[tool.uv.extra-build-variables]
mwparserfromhell = { WITH_EXTENSION = "0" }
