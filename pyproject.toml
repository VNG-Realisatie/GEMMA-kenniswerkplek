[project]
name = "llmwiki"
version = "0.1.0"
description = "Deterministisch gereedschap voor de LLM-wiki monorepo (zie ARCHITECTURE.md)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mediawiki = [
    "pywikibot>=9.0",
]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/llmwiki"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
