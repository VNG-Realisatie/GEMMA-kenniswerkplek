- domein: Archief
  entiteit: Rechthebbende
  type: homoniem
  bevinding:
  - '**GGM:** Rechthebbende in Archief is iemand die rechten heeft op een goed.'
  - '**Bevinding:** de Wet op de lijkbezorging en de beheersverordeningen gebruiken rechthebbende voor wie het uitsluitend recht op een particulier graf heeft (art. 23, 28). Deze wiki noemt dat element Rechthebbende op het graf.'
  - '**Voorstel:** de GGM-definitie in Archief verbijzonderen (rechthebbende op archiefbescheiden), zodat de algemene naam niet aan één domein vastzit.'
  element: rechthebbende-op-het-graf
  nummer: 11
  status: open
- domein: RSGBPlus
  entiteit: Akte van de burgerlijke stand
  type: hiaat
  element: akte-van-de-burgerlijke-stand
  bevinding:
  - '**GGM:** het GGM kent geen entiteit voor de akte van de burgerlijke stand; IngeschrevenPersoon en de BRP-categorieën verwijzen wel naar brondocumenten.'
  - '**Bevinding:** de gemeente maakt akten op in de registers van geboorten, huwelijken, geregistreerde partnerschappen en overlijden en verwerkt ze als brondocument in de BRP (2026-rijk-burgerlijk-wetboek-boek-1, art. 16a, 18, 19; 2026-rvig-hup-algemeen). De akten worden digitaal bijgehouden en elektronisch aangegeven met het burgerservicenummer (2026-rijk-besluit-burgerlijke-stand-1994-bwbr0006493, art. 67a).'
  - '**Voorstel:** een entiteit Akte van de burgerlijke stand in een beleidsdomein Burgerzaken, met onder meer:'
  - '- soort akte, aktenummer, register en gemeente;'
  - '- datum opmaak en ambtenaar van de burgerlijke stand;'
  - '- latere vermeldingen;'
  - '- de relatie met de ingeschreven persoon (brondocument).'
  - In het model is de akte het kernobject van het bedrijfsproces Bijhouden burgerlijke stand; de soorten akte (geboorte, levenloos geboren kind, erkenning, naamskeuze, huwelijk, registratie van partnerschap, omzetting, inschrijving, overlijden) zijn specialisaties zonder eigen entiteit, met dezelfde levensloop (2026-rijk-besluit-burgerlijke-stand-1994-bwbr0006493, hoofdstuk 2).
  nummer: 12
  status: open
- domein: RSGBPlus
  entiteit: VerblijfadresIngeschrevenPersoon
  type: duplicaat
  element: verblijfplaats
  bevinding:
  - '**GGM:** de gegevens over het verblijf en adres staan twee keer in RSGBPlus, met dezelfde definitie:'
  - '- VerblijfadresIngeschrevenPersoon (EAID_F6DAC299_3F19_45c6_BFFE_EB38C1C51459);'
  - '- VerblijfadresIngeschrevenNatuurlijkPersoon (EAID_E5E010C2_C1F3_4986_AA9A_C71C19263606).'
  - '**Bevinding:** de BRP kent één categorie Verblijfplaats van de ingeschreven persoon (2025-rvig-logisch-ontwerp-brp-2025q1, 4.4); de entiteit IngeschrevenNatuurlijkPersoon bestaat niet meer in het GGM.'
  - '**Voorstel:** samenvoegen tot VerblijfadresIngeschrevenPersoon.'
  nummer: 13
  status: open
- domein: RSGBPlus
  entiteit: Reisdocument
  type: definitie
  element: reisdocument
  bevinding:
  - '**GGM:** Reisdocument is een document dat vereist is voor reizen naar het buitenland; de attributen volgen categorie 12 van de BRP (soort, nummer, uitgifte, autoriteit, geldigheid, inhouding of vermissing).'
  - '**Bevinding:** de definitie noemt de houder en de identificatie niet, en ook een Nederlandse identiteitskaart is een reisdocument in de BRP en de praktijk (2025-rvig-logisch-ontwerp-brp-2025q1, 1.1; 2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-aanvragen). De Paspoortwet maakt het document op naam van de houder en rijkseigendom (2026-rijk-paspoortwet-bwbr0005212, art. 1 onder f, 2 lid 4). Categorie 12 bevat naast het Nederlands reisdocument ook de signalering (groep 36), die het GGM niet kent (2025-rvig-logisch-ontwerp-brp-2025q1, 4.4; 2026-rvig-hup-signalering-verstrekking-reisdocument).'
  - '**Voorstel:** de definitie aanpassen: een document van het Koninkrijk op naam van een persoon waarmee hij kan reizen en zich kan identificeren, zoals een paspoort of identiteitskaart. Daarnaast de signalering opnemen, als attribuut van de ingeschreven persoon (verstrekkingsbelemmering) of als eigen groep, met ingangsdatum en verwijdering.'
  nummer: 14
  status: open
- domein: RSGBPlus
  entiteit: NederlandseNationaliteitIngeschrevenPersoon
  type: definitie
  bevinding:
  - '**GGM:** NederlandseNationaliteitIngeschrevenPersoon heeft de definitie ''Gegevens over de nationaliteit.'', met de attributen aanduidingBijzonderNederlanderschap, redenVerkrijgingNederlandseNationaliteit, redenVerliesNederlandseNationaliteit en nationaliteit.'
  - '**Bevinding:** de entiteit gaat over het Nederlanderschap: de Nederlandse nationaliteit, verkregen van rechtswege, door optie of door verlening, en verloren door onder meer afstand (2026-rijk-rijkswet-op-het-nederlanderschap-bwbr0003738, art. 3-7, 15; 2026-rvig-hup-nederlandse-nationaliteit). De definitie onderscheidt haar niet van de andere entiteiten voor de nationaliteit.'
  - '**Voorstel:** ''De Nederlandse nationaliteit van een persoon, verkregen van rechtswege, door optie of door naturalisatie, tot het verlies ervan.'', en de naam Nederlanderschap overwegen.'
  element: nederlanderschap
  nummer: 15
  status: open
- domein: RSGBPlus
  entiteit: Nationaliteit
  type: structuur
  bevinding:
  - '**GGM:** de nationaliteit staat in vier entiteiten in RSGBPlus:'
  - '- Nationaliteit (EAID_69B41CDD_C3F1_449b_92B4_8F7657840646), de rechtsverhouding, met redenen van verkrijging en verlies;'
  - '- Nationaliteit (EAID_71B3BE0D_2BF9_4740_9597_A0EEC75AFE9B), met dezelfde definitie maar met code, omschrijving en geldigheid: de referentielijst van nationaliteiten (in GEMMA de groepering Referentielijsten);'
  - '- NationaliteitIngeschrevenNatuurlijkPersoon (EAID_261B509E_6879_4475_B5F8_77E8428816CE), met reden verkrijging en verlies en buitenlands persoonsnummer;'
  - '- NederlandseNationaliteitIngeschrevenPersoon (EAID_BA5F2281_466D_4c69_9EB8_D10614C5CD8E), met de redenen voor de Nederlandse nationaliteit en de aanduiding bijzonder Nederlanderschap.'
  - '**Bevinding:** de BRP kent één gegevensgroep nationaliteit per persoon, met de Nederlandse, vreemde en onbekende nationaliteit en staatloosheid als soorten, en het bijzonder Nederlanderschap in dezelfde stapel als de Nederlandse (2026-rvig-hup-nationaliteit). Twee entiteiten met dezelfde naam en definitie voor een ander begrip (rechtsverhouding en referentielijst) zijn een homoniem; de reden van verkrijging en verlies staat drie keer.'
  - '**Voorstel:** één entiteit Nationaliteit voor de rechtsverhouding, met Nederlanderschap als specialisatie; de referentielijst een eigen naam geven (bijvoorbeeld Nationaliteitentabel); de mGBA-entiteiten daarop afbeelden.'
  element: nederlanderschap
  nummer: 16
  status: open
- domein: RSGBPlus
  entiteit: null
  type: hiaat
  bevinding:
  - '**GGM:** het GGM kent geen stempas en geen ander begrip voor de gemeentelijke taak bij verkiezingen.'
  - '**Bevinding:** de burgemeester stelt bij elke verkiezing de gegevens van de geregistreerde kiezers vast, verstrekt elke kiezer een stempas met volgnummer, vervangt haar op verzoek en houdt een register van ongeldige stempassen bij (2026-rijk-kieswet-bwbr0004627, art. J 7, J 7a, J 8). Relevante attributen:'
  - '- volgnummer;'
  - '- kiezer (ingeschreven persoon) en verkiezing;'
  - '- datum van verstrekking;'
  - '- soort (stempas, vervangende stempas, kiezerspas, omgezet in volmachtbewijs);'
  - '- ongeldig, met reden (art. J 7a lid 2).'
  - '**Voorstel:** opnemen in RSGBPlus of een beleidsdomein Verkiezingen, met een relatie naar IngeschrevenPersoon.'
  element: stempas
  nummer: 17
  status: open
- domein: RSGBPlus
  entiteit: null
  type: hiaat
  element: rijbewijs
  bevinding:
  - '**GGM:** het GGM kent geen rijbewijs en geen ander begrip voor de afgifte van een rijbewijs door de gemeente.'
  - '**Bevinding:** de burgemeester neemt de aanvraag van een rijbewijs in ontvangst, besluit tot afgifte, geeft het rijbewijs af en reikt het uit (2026-rijk-wegenverkeerswet-1994-bwbr0006622, art. 113, 116, 118a, 120a). Het rijbewijzenregister met de gegevens van elk rijbewijs is van de RDW en niet van de gemeente (art. 126); voor de gemeentelijke afgifte zijn de volgende attributen relevant:'
  - '- rijbewijsnummer;'
  - '- houder (ingeschreven persoon);'
  - '- categorieën, met beperkingen;'
  - '- datum van afgifte en geldig tot;'
  - '- afgevende autoriteit (burgemeester of RDW);'
  - '- ongeldig, met reden (art. 123).'
  - '**Voorstel:** opnemen in RSGBPlus bij het beleidsdomein Burgerzaken, met een relatie naar IngeschrevenPersoon; alleen de gegevens die de gemeente voor de afgifte nodig heeft, niet het rijbewijzenregister van de RDW.'
  nummer: 18
  status: open
