  - id: id-9a240ef1e16e476887b3c67526facb98
    naam: Verblijfplaats
  bevinding:
  - '**GEMMA:** het bedrijfsobject Verblijfplaats is "de locatie waar een persoon feitelijk woont of verblijft", en verwijst naar de GGM-guid {0028CB85-5EF0-45aa-A06F-4A8F14E71AB8} (2026-vng-gemma-2026-10-02).'
  - '**Bevinding:** de definitie dekt het woonadres, niet het briefadres en niet de periode waarin het adres geldt; de BRP kent één categorie Verblijfplaats met woonadres en briefadres als soorten (2026-rvig-hup-verblijfplaats; 2025-rvig-logisch-ontwerp-brp-2025q1). De GGM-guid komt in het huidige GGM niet meer voor: de entiteit heet VerblijfadresIngeschrevenPersoon (GGM-terugmelding 13).'
  - '**Voorstel:** definieer Verblijfplaats als het adres waar een ingeschreven persoon woont of, zonder woonadres, zijn post ontvangt, met de periode waarin dat adres geldt, en werk de GGM-guid bij na de GGM-terugmelding.'
