# GEMMA-terugmeldingen: het register van voorstellen aan het GEMMA-team over het GEMMA-model (besluit redacteur 2026-10-08).
# De AI voegt een melding toe zonder nummer; tools/afleiden.py geeft het volgende nummer.
# tools/render.py maakt hieruit analyses/gemma-terugmeldingen.md en de sectie op de elementpagina.
terugmeldingen:
- type: element
  elementen:
  - asverstrooiing
  gemma_elementen:
  - id: id-11ceda47-d0a4-49cb-88d7-eaf623172f3f
    naam: Producten- en dienstenrealisatie veiligheidsdomein
  - id: id-de168a10-7030-4026-bd95-298e6a6cb3e2
    naam: Uitvoering openbare orde en veiligheid
  bevinding:
  - '**GEMMA:** de functies Producten- en dienstenrealisatie veiligheidsdomein en Uitvoering openbare orde en veiligheid omvatten onder meer Vergunningenbeheer evenementen en Horeca vergunningverlening (2026-vng-gemma-2026-10-02). De UPL zet asverstrooiing onder Openbare orde en veiligheid (2025-vng-upl-producten-en-diensten-extern, nr. 32).'
  - '**Bevinding:** asverstrooiing is alleen in de Model-APV geregeld, en gemeenten mogen die bepaling weglaten (2023-vng-model-apv). In de wiki bleef daardoor niets over wat deze twee functies bedienen, dus vervallen ze en staat asverstrooiing bij de andere producten van de lijkbezorging. De import verwijdert niets, dus in GEMMA blijft staan wat de wiki laat vervallen. Ook de andere producten onder deze functies (zoals de evenementenvergunning) berusten deels alleen op de APV.'
  - '**Voorstel:** verwijder asverstrooiing ook uit GEMMA, samen met de twee functies die alleen daarvoor in de wiki stonden. Beoordeel bij een onderwerp Openbare orde en veiligheid per overig product of het een landelijke wettelijke basis heeft, en laat de producten zonder die basis ook vervallen.'
  nummer: 1
  status: open
- type: definitie
  elementen:
  - kiezer
  - gemeenteraad
  - college-van-b-w
  - rijk
  gemma_elementen:
  - id: id-d649e10e-d9a6-4ac7-b436-2d659cb4fdbf
    naam: Kiezer
  - id: id-b69cb101-8708-47de-9ac1-e138f205a49f
    naam: Gemeenteraad
  - id: id-af1a85d2-b6d6-44da-b562-ef2ccd69108e
    naam: College
  - id: id-9f6a80ba-b7fb-4a58-b599-b5f2b33b840e
    naam: Rijk
  bevinding:
  - '**GEMMA:** de rol Kiezer en de actoren Gemeenteraad, College en Rijk hebben geen definitie (2026-vng-gemma-2026-10-02). Rijk heeft ook geen relaties.'
  - '**Bevinding:** de wiki heeft deze vier elementen aan GEMMA gekoppeld. De import vult dus de definities in en hernoemt College naar College van B&W, want "College" kan meerdere organen bedoelen.'
  - '**Voorstel:** controleer de definities en de nieuwe naam bij de import:'
  - '- Kiezer: wie kiesgerechtigd en als kiezer geregistreerd is en bij een verkiezing mag stemmen;'
  - '- Gemeenteraad: het bestuursorgaan dat de bevolking vertegenwoordigt en de gemeentelijke verordeningen vaststelt;'
  - '- College van B&W: het dagelijks bestuur, de burgemeester en de wethouders;'
  - '- Rijk: de Staat der Nederlanden als bestuurslaag, met zijn ministers en rijksdiensten, en de relaties daarvan.'
  nummer: 2
  status: open
- type: definitie
  elementen:
  - verblijfplaats
  gemma_elementen:
  - id: id-9a240ef1e16e476887b3c67526facb98
    naam: Verblijfplaats
  bevinding:
  - '**GEMMA:** Verblijfplaats is "de locatie waar een persoon feitelijk woont of verblijft" (2026-vng-gemma-2026-10-02).'
  - '**Bevinding:** dat past niet bij de BRP, waar de verblijfplaats het woonadres of het briefadres is, met de periode dat het adres geldt (2026-rvig-hup-verblijfplaats). De import vervangt de definitie door die van de wiki. De GGM-guid in GEMMA verwijst bovendien naar een entiteit die niet meer bestaat; die heet nu VerblijfadresIngeschrevenPersoon (GGM-terugmelding 13).'
  - '**Voorstel:** neem de definitie van de wiki over: het adres waar een ingeschreven persoon woont of, zonder woonadres, zijn post ontvangt, met de periode waarin dat adres geldt. Werk de GGM-guid bij.'
  nummer: 3
  status: open
