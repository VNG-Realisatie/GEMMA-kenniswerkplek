definitie: Kerkelijke gemeenschap, met inbegrip van haar zelfstandige onderdelen en de lichamen waarin kerkgenootschappen zijn verenigd.
beschrijving:
- Kerkgenootschappen, hun zelfstandige onderdelen en de lichamen waarin zij zijn verenigd, hebben rechtspersoonlijkheid en worden geregeerd door hun eigen statuut, voor zover dat niet in strijd is met de wet (BW Boek 2 art. 2).
per_onderwerp:
  lijkbezorging:
  - Een kerkgenootschap kan een bijzondere begraafplaats of een bijzonder crematorium houden (Wet op de lijkbezorging art. 37, 52). Maakt het daarvan geen gebruik, dan stelt de gemeente op verzoek een deel van de gemeentelijke begraafplaats ter beschikking; over de inrichting en het gebruik daarvan overlegt het college met het kerkgenootschap (art. 39; Groningen art. 29). Een gezindte die een deel van een gemeentelijke begraafplaats beheert, valt eronder (Groningen art. 3 lid 3).
