genoemd_begrip: Bijhouden persoonsgegevens
toelichting: 'Invoer van een andere partij, geen pagina: de rechtbank spreekt de curatele uit en die staat in het centraal curatele- en bewindregister; de gemeente neemt haar over in de BRP in Bijhouden persoonsgegevens (HUP Curatele). Curatele sluit gezag over een minderjarige uit (HUP Gezagsverhouding). Boek 1 titel 16 valt buiten de afbakening van de wetsbron (besluit redacteur 2026-10-06); de curator verzoekt soms namens de persoon, bijvoorbeeld om gegevens te overschrijven (HUP Overschrijven gegevens bij geslachtswijziging).'
bronnen:
- 2026-rvig-hup-overschrijven-gegevens-bij-geslachtswijziging
