genoemd_begrip: Akte van de burgerlijke stand
toelichting: 'Specialisatie zonder pagina van Akte van de burgerlijke stand (Besluit burgerlijke stand art. 61-65); de relaties gaan naar de akte. Ook bij lijkvinding wordt een akte van overlijden opgemaakt (art. 62). In de UPL is overlijdensakte (nr. 316, BW 1 art. 19f) de dienst Overlijdensakte: een uittreksel of afschrift van deze akte. Tot 2026-10-07 een verwijzing vanuit Lijkbezorging.'
