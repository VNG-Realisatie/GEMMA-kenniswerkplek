definitie: Het in ontvangst nemen en onderzoeken van optie, naturalisatieverzoek en afstand van het Nederlanderschap, en het bevestigen of uitreiken door de burgemeester.
beschrijving:
- In het Europese deel van Nederland neemt de burgemeester optieverklaringen, naturalisatieverzoeken en verklaringen van afstand in ontvangst van wie in zijn gemeente is ingeschreven of verblijft (Besluit verkrijging en verlies Nederlanderschap art. 2, 7, 33, 63). Bij optie behandelt hij de verklaring zelf en bevestigt of weigert hij de verkrijging; bij naturalisatie onderzoekt hij het verzoek, adviseert hij de minister van Justitie en Veiligheid en reikt hij het uittreksel van het besluit uit; bij afstand neemt hij de verklaring in ontvangst en bevestigt hij haar (Rijkswet op het Nederlanderschap art. 6, 7; Besluit art. 11, 36-38, 60a, 60b, 63).
- Het is het deel van de gemeente binnen het ketenproces Beheren Nederlanderschap; het deel van de minister staat in de beschrijving van dat ketenproces.
naamkeuze:
- Infinitief met object in GEMMA-volgorde, naar de titel van het Besluit verkrijging en verlies Nederlanderschap, dat vooral de administratieve behandeling door de burgemeester regelt. Behandelen verzoeken en verklaringen Nederlanderschap is overwogen, maar de ceremonie is geen verzoek en geen verklaring (besluit redacteur 2026-10-07).
