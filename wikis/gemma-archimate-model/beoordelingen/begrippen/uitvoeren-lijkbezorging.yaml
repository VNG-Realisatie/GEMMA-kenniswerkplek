taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
grondslag: bron
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen element voor dit begrip; nieuw voor GEMMA.
definitie: Het begraven, cremeren of op een andere wettelijke wijze bezorgen van een lijk, met de bestemming van de as.
beschrijving:
- De lijkbezorging geschiedt door begraving, crematie of op een andere wettelijk voorziene wijze, en omvat ook het geven van een bestemming aan de as (art. 1, 18 lid 2). Ze vereist een verlof tot begraving of crematie (art. 11) en volgt, waar mogelijk, de wens van de overledene (art. 19). Op de gemeentelijke begraafplaats bepaalt de beheerder tijd en plaats in overleg met de uitvaartondernemer, na kennisgeving door wie de uitvaart regelt (Groningen art. 7). Begraving, crematie, ontleding, bijzetting en verstrooiing zijn varianten zonder eigen pagina.
specialisaties:
- naam: Begraving
  omschrijving: Begraven van een lijk op een begraafplaats, in een algemeen of particulier graf (art. 23). Geen eigen pagina.
- naam: Crematie
  omschrijving: Cremeren van een lijk in een crematorium (art. 49). Geen eigen pagina.
- naam: Ontleding
  omschrijving: Ontleden van een lijk in het belang van de wetenschap, met verlof van de burgemeester (art. 67, 68). Geen eigen pagina.
- naam: Bijzetting
  omschrijving: Bijzetten van een asbus in een crematorium, graf, urnennis of bewaarplaats (art. 62). Geen eigen pagina.
- naam: Verstrooiing
  omschrijving: Verstrooien van as op een daartoe bestemd terrein of in open zee (art. 66a). Geen eigen pagina.
- naam: Incidentele asverstrooiing
  omschrijving: Verstrooien van as op een aangewezen plek op of buiten de begraafplaats, met toestemming van het college (Groningen art. 1 m, 21). Geen eigen pagina.
