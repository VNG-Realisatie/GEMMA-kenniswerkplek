  omschrijving: 'De gemeente legaliseert de handtekening van de gastheer op het formulier bewijs garantstelling en/of particuliere logiesverstrekking, dat de gast gebruikt voor een visumaanvraag; het formulier is een half jaar geldig (Utrecht Garantstelling). Geen eigen pagina: een legalisatie met een ander formulier, die de UPL niet apart noemt onder 0.2.'
