  sterkte: sterk
  onderbouwing: Zelfde bestuursrechtelijke begrip; de GGM-definitie omvat ook de civielrechtelijke beschikking. Geen van de twee GUID's is primair; de GUID van Generiek Jeugd en Wmo blijft de koppeling (besluit redacteur 2026-09-30). Terugmeldingen 5 en 8.
  duplicaten:
