genoemd_begrip: Ingeschreven persoon
toelichting: 'Eigenschap van Ingeschreven persoon, geen pagina: het huwelijk en het geregistreerd partnerschap als relatie tussen twee personen staan in de BRP als gegevens van de persoon, met de (ex-)echtgenoot of partner als gerelateerde (HUP Huwelijk/geregistreerd partnerschap). De akten zijn specialisaties van Akte van de burgerlijke stand; het sluiten en ontbinden zijn de bedrijfsprocessen Voltrekken huwelijk, Registreren partnerschap en Inschrijven ontbinding huwelijk of partnerschap. Het GGM kent de burgerlijke staat als attribuut en de sluiting en ontbinding als gegevensgroepen.'
