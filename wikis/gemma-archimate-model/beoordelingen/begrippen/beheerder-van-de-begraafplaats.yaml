begrip: Beheerder van de begraafplaats
synoniem_van: Houder van de begraafplaats
toelichting: Synoniem van Houder van de begraafplaats (besluit redacteur 2026-10-08). De Wet op de lijkbezorging kent alleen de houder van de begraafplaats (art. 8, 23, 27, 28, 31); de beheerder is de ambtenaar die bij een gemeentelijke begraafplaats de dagelijkse leiding heeft en de taken van de houder met mandaat uitvoert, ingericht door de beheersverordening (2010-vng-model-beheersverordening-begraafplaatsen, toelichting 2; 2023-groningen-beheersverordening-gemeentelijke-begraafplaatsen, art. 1 e). Zonder landelijke wettelijke bron blijft hij geen eigen rol (regel Wettelijke grondslag).
onderwerpen:
- lijkbezorging
