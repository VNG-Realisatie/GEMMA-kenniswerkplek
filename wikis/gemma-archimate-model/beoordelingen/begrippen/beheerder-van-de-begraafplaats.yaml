  onderbouwing: De GEMMA-rol Beheerder is generiek en heeft geen definitie; deze rol is daarvan een specialisatie voor de begraafplaats (zie Generiek GEMMA-element). Geen match, zodat de export het generieke GEMMA-element niet overschrijft (besluit redacteur 2026-10-04).
