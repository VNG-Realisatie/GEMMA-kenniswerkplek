taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
grondslag: bron
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen element voor dit begrip; nieuw voor GEMMA.
definitie: Het afgeven van het schriftelijk verlof waarmee een lijk mag worden begraven of gecremeerd.
beschrijving:
- Geen begraving of crematie geschiedt zonder schriftelijk verlof van de ambtenaar van de burgerlijke stand, dat kosteloos wordt afgegeven (art. 11). Hij verleent het alleen als hij beschikt over een verklaring van overlijden van de behandelend arts of de gemeentelijke lijkschouwer, of over een verklaring van geen bezwaar van de officier van justitie (art. 12). De stukken worden bij de akte van overlijden gevoegd (art. 13). In de praktijk krijgt de uitvaartondernemer het verlof na de aangifte van overlijden (Ondernemersplein).
besluiten:
- datum: '2026-10-01'
  besluit: 'Afwijzen: geen eigen proces; het verlof blijft een specialisatie van Vergunning (precedent 2026-09-29). De ambtenaar van de burgerlijke stand hangt via de functie Lijkbezorging aan gedrag.'
  gevolg: afwijzen
