definitie: 'Het beheer van een graf over de hele levensloop: uitgeven, begraven en bijzetten, onderhouden en ruimen.'
beschrijving:
- De houder van de begraafplaats bepaalt bij een algemeen graf wie erin wordt begraven, houdt het register van begraven lijken bij en ruimt graven na ten minste tien jaar grafrust (Wet op de lijkbezorging art. 23, 27, 31). Op de gemeentelijke begraafplaats regelt de beheersverordening de soorten graven, de uitgifte, het onderhoud en de ruiming (Groningen art. 11–16, 23, 27).
