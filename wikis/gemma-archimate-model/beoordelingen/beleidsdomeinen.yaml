- beleidsdomein: Begraafplaatsen en crematoria
  taakveld: 7 Volksgezondheid en Milieu
  herkomst: beschrijving van de vervallen taak Verzorgen lijkbezorging (besluit redacteur 2026-10-08)
  beschrijving:
  - 'Lijkbezorging geschiedt door begraving, crematie of een andere wettelijke wijze (Wet op de lijkbezorging art. 1). De gemeente schouwt stoffelijke overschotten via de gemeentelijke lijkschouwer, geeft het verlof tot begraving of crematie af, heeft ten minste één gemeentelijke begraafplaats, geeft graven uit, staat opgraving en ruiming toe en draagt zorg voor de lijkbezorging als niemand daarin voorziet (art. 4, 11, 21, 28, 29, 31, 33).'
  bronnen:
  - 2026-rijk-wet-op-de-lijkbezorging-wettekst
