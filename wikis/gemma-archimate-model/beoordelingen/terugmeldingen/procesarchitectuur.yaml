  - verzorgen-gemeentebegrafenis
  bevinding:
  - '**Kennismodel:** een ketenproces is een samenhangend geheel van processen over afdelingen of organisaties heen, en aggregeert bedrijfsprocessen: Ketenproces → aggregatie → Bedrijfsproces (2026-vng-over-gemma, regel 564, 590).'
  - '**Bevinding:** de pagina Proceshiërarchie op GEMMA Online zegt het tegendeel: een ketenproces als proces boven de eigen bedrijfsprocessen is vanuit de procesarchitectuur gezien niet correct; ketensamenwerking is in ArchiMate een bedrijfsinteractie waarin de bedrijfsprocessen van de betrokken organisaties samenkomen (2026-vng-gemma-proceshierarchie, regel 144, 146). Het GEMMA-model volgt die pagina: de bedrijfsinteractie Ketensamenwerking wordt bediend door de bedrijfsprocessen van de partijen. De pagina Impact van ketensamenwerking onderscheidt daarbij een estafette- en een orkestratiemodel (2026-vng-gemma-impact-ketensamenwerking, regel 27-34).'
  - 'In het model: een estafette is een bedrijfsinteractie met een kernobject, bediend door de levensloopprocessen van de partijen. Voorbeeld: Bezorgen stoffelijk overschot, bediend door Toestaan lijkbezorging (de gemeente als overheid), Begraven en cremeren stoffelijk overschot (de houder van de begraafplaats of het crematorium) en Verzorgen gemeentebegrafenis, met de officier van justitie als ketenpartner (2026-rijk-wet-op-de-lijkbezorging-wettekst, art. 10, 11, 12, 21, 23, 49). Bij orkestratie is er geen interactie: het deel dat de gemeente voor een andere partij uitvoert, is een specialisatie van Leveren dienst aan derden (bijvoorbeeld de verklaring omtrent het gedrag en de naturalisatie).'
  - '**Voorstel:** haal Ketenproces → aggregatie → Bedrijfsproces uit het kennismodel en neem de bedrijfsinteractie op, bediend door bedrijfsprocessen en toegewezen aan een bedrijfssamenwerking of aan de rollen van de partijen.'
