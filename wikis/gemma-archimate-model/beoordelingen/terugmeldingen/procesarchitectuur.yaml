  beleidsdomein: Begraafplaatsen en crematoria
  bevinding:
  - '**UPL:** de producten van de lijkbezorging vallen in drie GEMMA-domeinen (2025-vng-upl-producten-en-diensten-extern):'
  - '- Fysieke leefomgeving: grafuitgifte, grafonderhoud, gedenkteken plaatsingsvergunning, herbegraven of alsnog cremeren, verlof tot begraven, ontleding stoffelijk overschot toestemming, vervoersdocumenten stoffelijk overschot, crematoriumregister en bijzettingenregister;'
  - '- Publieksdiensten: begraafplaatsregister en bijzondere begraafplaats toestemming;'
  - '- Openbare orde en veiligheid: asverstrooiing.'
  - '**Bevinding:** verwante producten komen zo in verschillende domeinen terecht. Het begraafplaatsregister staat bij Publieksdiensten, het crematorium- en het bijzettingenregister bij Fysieke leefomgeving. In het GEMMA-model valt het verwante beleidsdomein Gemeentebegrafenissen bovendien onder Sociaal domein. GEMMA zet alle producten en diensten van de lijkbezorging bij elkaar in één beleidsdomein, Begraafplaatsen en crematoria, onder taakveld 7 (Iv3 7.5); in de Functie-indeling naar domein houden ze het GEMMA-domein uit de UPL, behalve asverstrooiing: dat staat onder Exploiteren van begraafplaatsen (Fysieke leefomgeving), omdat het geen landelijke wettelijke grondslag heeft en de functies van Openbare orde en veiligheid in GEMMA-terugmelding 1 ter discussie staan (2023-vng-model-apv, art. 5:36).'
  - '**Voorstel:** neem in de UPL en het GEMMA-model het beleidsdomein Begraafplaatsen en crematoria op onder taakveld 7.5, met alle producten van de lijkbezorging, en leg vast onder welke GEMMA-domeinen het valt.'
