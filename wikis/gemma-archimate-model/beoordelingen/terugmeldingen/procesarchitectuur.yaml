- type: product
  elementen:
  - vermissing-of-diefstal-rijbewijs-doorgeven
  bevinding:
  - '**UPL:** de UPL kent geen product voor het melden van de vermissing of diefstal van een rijbewijs (2025-vng-upl-producten-en-diensten-extern).'
  - '**Bevinding:** het is een wettelijke taak: het rijbewijs verliest zijn geldigheid door aangifte van vermissing (2026-rijk-wegenverkeerswet-1994-bwbr0006622, art. 123 lid 1 onder h), en bij de aanvraag van een vervangend rijbewijs hoort een proces-verbaal van vermissing of diefstal (2026-rijk-reglement-rijbewijzen-bwbr0008074, art. 39 lid 1). Gemeenten nemen de melding aan de balie op, naast het online doorgeven bij de RDW (2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen). In GEMMA is het de dienst Vermissing of diefstal rijbewijs doorgeven, gerealiseerd door Verwerken vermissing rijbewijs.'
  - '**Voorstel:** neem in de UPL het product vermissing of diefstal rijbewijs op, met als grondslag art. 123 lid 1 onder h Wegenverkeerswet 1994 en art. 39 Reglement rijbewijzen.'
  nummer: 17
  status: open
- type: product
  elementen:
  - rijbewijs-aanvragen
  - behandelen-aanvraag-rijbewijs
  bevinding:
  - '**UPL:** het product rijbewijs gezondheidsverklaring (nr. 362) staat als zelfstandig product onder taakveld 0.2, met als grondslag art. 100 Reglement rijbewijzen (2025-vng-upl-producten-en-diensten-extern).'
  - '**Bevinding:** de gemeente heeft voor de gezondheidsverklaring geen eigen handeling. Art. 100 gaat over de aanvraag van een verklaring van geschiktheid bij het CBR: de aanvrager levert de gezondheidsverklaring aan het CBR, dat de verklaring registreert (2026-rijk-reglement-rijbewijzen-bwbr0008074, art. 97, 100). De gemeente verkoopt of ontvangt geen gezondheidsverklaring (2026-utrecht-burgerzaken-gezondheidsverklaring-en-medische-keuring-voor-rijbewijs); zij controleert alleen, bij de aanvraag van een rijbewijs, of een vereiste verklaring van geschiktheid is geregistreerd (art. 35, 45). GEMMA neemt het daarom niet op als element, maar als onderdeel van de dienst Rijbewijs aanvragen en van het bedrijfsproces Behandelen aanvraag rijbewijs.'
  - '**Voorstel:** laat het product in de UPL vervallen, of beschrijf het als onderdeel van het product rijbewijs, met art. 35 en 45 Reglement rijbewijzen als grondslag.'
  nummer: 18
  status: open
- type: grondslag
  elementen:
  - rijbewijs-aanvragen
  - verklaring-omtrent-gedrag-aanvragen
  bevinding:
  - '**UPL:** de grondslag van rijbewijs (nr. 360) is art. 26 Reglement rijbewijzen, die van verklaring omtrent gedrag (vog) (nr. 434) art. 28 Wet justitiële en strafvorderlijke gegevens (2025-vng-upl-producten-en-diensten-extern).'
  - '**Bevinding:** deze artikelen geven de gemeente geen taak. Art. 26 Reglement rijbewijzen zegt alleen dat de aanvraag volgens de volgende artikelen gaat; de bevoegdheid van de burgemeester tot afgifte staat in art. 116 lid 1 Wegenverkeerswet 1994 en art. 27 Reglement (2026-rijk-reglement-rijbewijzen-bwbr0008074; 2026-rijk-wegenverkeerswet-1994-bwbr0006622). Art. 28 Wjsg definieert de VOG; de gemeentelijke taak (ontvangen, controleren, doorzenden, vergoeding) staat in art. 30 en 39 (2026-rijk-wet-justitiele-en-strafvorderlijke-gegevens-bwbr0014194).'
  - '**Voorstel:** noem in de UPL als grondslag van rijbewijs art. 116 Wegenverkeerswet 1994 en art. 27 Reglement rijbewijzen, en van verklaring omtrent gedrag art. 30 en 39 Wjsg.'
  nummer: 19
