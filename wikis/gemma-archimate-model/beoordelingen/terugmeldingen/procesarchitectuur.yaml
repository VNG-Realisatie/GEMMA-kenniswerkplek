- type: grondslag
  elementen:
  - grafuitgifte
  bevinding:
  - '**UPL:** grafuitgifte heeft als grondslag art. 11 van de Model beheersverordening begraafplaatsen (2025-vng-upl-producten-en-diensten-extern, nr. 165).'
  - '**Bevinding:** art. 11 deelt alleen de graven in (particuliere graven en urnengraven, urnennissen, gedenkplaatsen). De uitgifte zelf staat in art. 13 tot 15: de volgorde van uitgifte, de categorieën en het recht op een particulier graf voor tien tot dertig jaar (2010-vng-model-beheersverordening-begraafplaatsen). De landelijke grondslag is de Wet op de lijkbezorging: een particulier graf met een uitsluitend recht, gevestigd voor ten minste tien jaar, op een gemeentelijke begraafplaats (2026-rijk-wet-op-de-lijkbezorging-wettekst, art. 23 lid 2, 28, 33).'
  - '**Voorstel:** noem in de UPL als grondslag art. 23, 28 en 33 Wet op de lijkbezorging, en als uitwerking art. 13 tot 15 van de Model beheersverordening.'
  nummer: 7
  status: open
- type: grondslag
  elementen:
  - grafonderhoud
  bevinding:
  - '**UPL:** grafonderhoud heeft als grondslag het Begraafplaatsenbeleid 2020-2030 van één gemeente (CVDR659831), geen landelijke regeling of modelverordening (2025-vng-upl-producten-en-diensten-extern, nr. 163).'
  - '**Bevinding:** een beleidsstuk van één gemeente is geen grondslag die voor alle gemeenten geldt. De Model beheersverordening regelt in art. 20 het onderhoud dat de gemeente altijd doet (eenmaal per jaar schoonmaken, winterharde beplanting) en in art. 21 het onderhoud door de rechthebbende (2010-vng-model-beheersverordening-begraafplaatsen). Het betaalde onderhoud op verzoek van de rechthebbende staat er niet in, wel in verordeningen van afzonderlijke gemeenten (2023-groningen-beheersverordening-gemeentelijke-begraafplaatsen, art. 23, 24). Een landelijke grondslag voor het onderhoud door de gemeente is er niet; de Wet op de lijkbezorging legt alleen de onderhoudsplicht bij de rechthebbende als die niet bij de houder ligt (2026-rijk-wet-op-de-lijkbezorging-wettekst, art. 28 lid 4). GEMMA houdt het product, met de Model beheersverordening als grondslag, en werkt het niet uit in processen.'
  - '**Voorstel:** noem in de UPL als grondslag art. 20 en 21 van de Model beheersverordening begraafplaatsen; neem het onderhoud op verzoek en tegen betaling op in de modelverordening, of beschrijf het product als het minimale onderhoud uit art. 20.'
  nummer: 8
  status: open
- type: grondslag
  elementen:
  - identiteitskaart
  bevinding:
  - '**UPL:** identiteitskaart heeft als grondslag art. 16a Paspoortwet (2025-vng-upl-producten-en-diensten-extern, nr. 186).'
  - '**Bevinding:** paragraaf 3A van de Paspoortwet, met art. 16a en 17 over de Nederlandse identiteitskaart, is per 2026-10-01 vervallen. De kaart heeft een eigen wet, de Wet op de Nederlandse identiteitskaart, waarnaar de Paspoortwet verwijst (2026-rijk-paspoortwet-bwbr0005212, art. 1 onder u, § 3A). GEMMA gebruikt die wet als grondslag (2026-rijk-wet-op-de-nederlandse-identiteitskaart-bwbr0052951, art. 11, 15, 25).'
  - '**Voorstel:** vervang in de UPL de grondslag door art. 11, 15 en 25 Wet op de Nederlandse identiteitskaart.'
  nummer: 9
  status: open
- type: grondslag
  elementen:
  - zakenpaspoort
  bevinding:
  - '**UPL:** zakenpaspoort heeft als grondslag art. 3 Paspoortuitvoeringsregeling Buitenland 2001 (2025-vng-upl-producten-en-diensten-extern, nr. 494).'
  - '**Bevinding:** die regeling gaat over aanvragen in het buitenland en is geen grondslag voor de gemeentelijke dienst. De gemeente verstrekt het zakenpaspoort als gewoon paspoort met 66 in plaats van 34 bladzijden (2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-aanvragen); de Paspoortwet kent het niet als eigen soort, en de HUP geeft het de letter B in het documentnummer (2026-rvig-hup-uitreiking-registreren-van-een-reisdocument). GEMMA modelleert het als aanvraag van een nationaal paspoort, met de Paspoortwet als grondslag (art. 26, 40).'
  - '**Voorstel:** vervang in de UPL de grondslag door art. 26 en 40 Paspoortwet.'
  nummer: 10
  status: open
- type: product
  elementen:
  - vermissing-of-diefstal-reisdocument-doorgeven
  bevinding:
  - '**UPL:** de UPL kent geen product voor het melden van de vermissing of diefstal van een reisdocument, en geen product voor het waarmerken van een kopie van een reisdocument (2025-vng-upl-producten-en-diensten-extern).'
  - '**Bevinding:** het doorgeven van vermissing of diefstal van een paspoort of identiteitskaart is een wettelijke taak: na de melding is het document ongeldig (2026-rijk-paspoortwet-bwbr0005212, art. 5a, 47 lid 1 onder j). Gemeenten bieden het aan, online en gratis (2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-vermissing-of-diefstal-doorgeven); in GEMMA is het de dienst Vermissing of diefstal reisdocument doorgeven, gerealiseerd door Verwerken vermissing reisdocument. Het waarmerken van een kopie bieden gemeenten ook aan, maar daarvoor is geen landelijke grondslag gevonden (niet in de Paspoortwet, het Paspoortbesluit of de Wet op de Nederlandse identiteitskaart), en gemeenten verschillen in wat ze waarmerken (2026-utrecht-burgerzaken-waarmerken-kopie-nederlands-reisdocument-aanvragen). GEMMA neemt het daarom niet op (regel Wettelijke grondslag).'
  - '**Voorstel:** neem in de UPL het product vermissing of diefstal reisdocument op, met als grondslag art. 5a en 47 Paspoortwet en de Wet op de Nederlandse identiteitskaart. Neem het waarmerken van een kopie niet op zolang er geen landelijke grondslag is.'
  nummer: 11
  status: open
- type: product
  elementen:
  - reisdocument-niet-ingezetene
  bevinding:
  - '**UPL:** de UPL kent onder taakveld 0.2 naast reisdocument niet-ingezetene (nr. 357, doelgroep burger) ook het product reisdocument (nr. 356), met dezelfde grondslag art. 4.2 Paspoortbesluit en zonder doelgroep (2025-vng-upl-producten-en-diensten-extern, nr. 356, 357).'
  - '**Bevinding:** art. 4.2 Paspoortbesluit gaat alleen over de verstrekking aan personen die niet als ingezetene in de BRP staan, door aangewezen gemeenten (2026-rijk-paspoortbesluit-bwbr0044308, art. 3.2, 4.2). Nr. 356 valt daarmee samen met nr. 357; de reisdocumenten van ingezetenen hebben elk een eigen product. In GEMMA is reisdocument (nr. 356) een synoniem van de dienst Reisdocument niet-ingezetene.'
  - '**Voorstel:** laat nr. 356 vervallen of voeg het samen met nr. 357.'
  nummer: 12
  status: open
- type: product
  elementen:
  - naturalisatieoptie
  bevinding:
  - '**UPL:** het product heet naturalisatieoptie, met grondslag art. 6 Rijkswet op het Nederlanderschap (2025-vng-upl-producten-en-diensten-extern, nr. 262).'
  - '**Bevinding:** optie en naturalisatie zijn twee wegen tot het Nederlanderschap, met een andere beslisser en procedure: bij optie beslist de burgemeester, bij naturalisatie de Koning op voordracht van de minister (2026-rijk-besluit-verkrijging-verlies-nederlanderschap-bwbr0013605, art. 1 onder c en d; 2026-utrecht-burgerzaken-nederlander-worden-door-naturalisatie-of-optie). Het product gaat over de optie; de naam naturalisatieoptie verwart de twee. GEMMA houdt de UPL-naam, met het synoniem Nederlander worden door optie.'
  - '**Voorstel:** noem het product in de UPL optie of optieverklaring.'
  nummer: 13
  status: open
- type: product
  elementen:
  - stemrecht
  bevinding:
  - '**UPL:** het product stemrecht heeft als grondslag art. B 1-B 3 en Y 2 Kieswet (2025-vng-upl-producten-en-diensten-extern, nr. 398).'
  - '**Bevinding:** het kiesrecht is een recht van de persoon, geen prestatie van de gemeente. Wat de gemeente levert, is de registratie van de kiesgerechtigdheid en de mededeling op verzoek of iemand als kiezer is geregistreerd (2026-rijk-kieswet-bwbr0004627, art. D 1, D 5). In GEMMA is Stemrecht de dienst die het bedrijfsproces Registreren kiesgerechtigdheid realiseert.'
  - '**Voorstel:** voeg in de UPL art. D 1 en D 5 Kieswet toe als grondslag, en beschrijf het product als de registratie van en de mededeling over de kiesgerechtigdheid.'
  nummer: 14
  status: open
- type: product
  elementen:
  - stempas-ontvangen
  bevinding:
  - '**UPL:** het product heet stempas (2025-vng-upl-producten-en-diensten-extern, nr. 397).'
  - '**Bevinding:** de stempas is ook het bedrijfsobject Stempas, kernobject van Beheren stempassen (2026-rijk-kieswet-bwbr0004627, art. J 7 lid 2). Een dienst met dezelfde naam als het object maakt het model dubbelzinnig. GEMMA noemt de dienst daarom Stempas ontvangen, met de UPL-naam als synoniem, zoals Briefadres aanvragen bij briefadres.'
  - '**Voorstel:** geef een product in de UPL de naam van wat de afnemer doet of krijgt (stempas ontvangen) wanneer de productnaam ook een object is; of leg vast dat GEMMA in dat geval de naam aanvult.'
  nummer: 15
  status: open
- type: product
  elementen:
  - rijbewijs-aanvragen
  - verklaring-omtrent-gedrag-aanvragen
  bevinding:
  - '**UPL:** de producten heten rijbewijs (nr. 360) en verklaring omtrent gedrag (vog) (nr. 434) (2025-vng-upl-producten-en-diensten-extern).'
  - '**Bevinding:** beide zijn ook een bedrijfsobject, Rijbewijs en Verklaring omtrent het gedrag, en het kernobject van Beheren rijbewijzen en Afgeven verklaring omtrent het gedrag (2026-rijk-wegenverkeerswet-1994-bwbr0006622, art. 116; 2026-rijk-wet-justitiele-en-strafvorderlijke-gegevens-bwbr0014194, art. 28). GEMMA noemt de diensten daarom Rijbewijs aanvragen en Verklaring omtrent gedrag aanvragen, met de UPL-naam als synoniem, zoals bij nr. 15.'
  - '**Voorstel:** als bij nr. 15: de productnaam vanuit de afnemer (rijbewijs aanvragen, verklaring omtrent gedrag aanvragen), of vastleggen dat GEMMA de naam aanvult.'
  nummer: 16
