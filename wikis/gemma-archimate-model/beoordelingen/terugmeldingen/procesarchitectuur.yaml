- type: grondslag
  elementen:
  - legalisatie-handtekening
  bevinding:
  - '**UPL:** legalisatie handtekening heeft als grondslag art. 23 Wet griffierechten burgerlijke zaken (2025-vng-upl-producten-en-diensten-extern, nr. 226).'
  - '**Bevinding:** art. 23 lid 2 regelt alleen het griffierecht voor de legalisatie van handtekeningen: een tarief, geen taak of bevoegdheid van de gemeente of de burgemeester (2026-rijk-wet-griffierechten-burgerlijke-zaken-bwbr0028899, art. 23, 24). Een andere landelijke grondslag is niet gevonden, en ook geen VNG-modelverordening die de dienst regelt; gemeenten legaliseren namens de burgemeester zonder een artikel te noemen. GEMMA houdt het product omdat het in de UPL staat, maar werkt het niet uit in processen, objecten of rollen.'
  - '**Voorstel:** zoek de bevoegdheidsgrondslag van de burgemeester voor de legalisatie van een handtekening uit en neem die op in de UPL. Is er geen, vermeld dan dat het een taak is die de gemeente zelf op zich neemt (Gemeentewet art. 108 lid 1), met de leges in de legesverordening, en noem de Wet griffierechten niet als grondslag.'
