- type: kennismodel
  elementen:
  - beheren-grafrechten
  - beheren-graven
  - bijhouden-persoonsgegevens
  - beheren-reisdocumenten
  bevinding:
  - '**GEMMA Online, Proceshiërarchie:** het hoogste niveau van de hiërarchie is het klant-tot-klant- of bedrijfsproces; daarboven spreekt GEMMA van clusters van bedrijfsprocessen: een groepering van bedrijfsprocessen die bij elkaar horen omdat ze op hetzelfde thema betrekking hebben, bijvoorbeeld personeelszaken (2026-vng-gemma-proceshierarchie, regel 47, 91).'
  - '**Bevinding:** het processenlandschap van het GEMMA-model deelt de uitvoerende processen alleen in naar soort werk (Uitvoeren, Handhaven, Nazorgen, Ontwikkelen; GEMMA type Bedrijfsproces (cluster)). Alleen de ondersteunende tak heeft clusters per thema, zoals Beheren personeel, zonder bedrijfsprocessen eronder. Het model groepeert de bedrijfsprocessen per kernobject in een levensloopproces: het gedrag over de levensloop van één kernobject van begin tot eind (Beheren grafrechten, Beheren graven, Bijhouden persoonsgegevens, Beheren reisdocumenten), met GEMMA type Bedrijfsproces (cluster). Daarboven staan het beleidsdomein en het taakveld, afgeleid uit het kernobject.'
  - '**Voorstel:**'
  - '- neem het levensloopproces op als cluster per thema voor de uitvoerende processen, naast de indeling naar soort werk, die blijft;'
  - '- zie de themaclusters van de ondersteunende tak (Beheren personeel, Beheren financiën) als groepering per beleidsdomein, met levensloopprocessen per kernobject eronder, zoals in de uitvoerende tak.'
  nummer: 20
