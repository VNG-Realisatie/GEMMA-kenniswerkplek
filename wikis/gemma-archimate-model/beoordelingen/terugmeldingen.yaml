# GGM-terugmeldingen: het register. De AI voegt een melding toe zonder nummer; tools/afleiden.py geeft het volgende nummer.
# tools/render.py maakt hieruit analyses/ggm-terugmeldingen.md en de sectie op de elementpagina.
terugmeldingen:
- nummer: 1
  domein: Gemeentebegrafenissen
  entiteit: Gemeentebegrafenis
  type: definitie
  bevinding: 'Definitie ''Teraardebestelling onder verantwoordelijjkheid van de gemeente'' is te smal: de burgemeester draagt zorg voor de lijkbezorging als niemand daarin voorziet, en dat kan ook crematie zijn; alleen een lijk waarvan de identiteit niet kan worden vastgesteld, wordt begraven (Wet op de lijkbezorging art. 21 lid 1 en 6). Voorstel: ''Lijkbezorging waarvoor de gemeente zorgt en betaalt omdat niemand anders daarin voorziet.'' Ook tikfout ''verantwoordelijjkheid''.'
  element: gemeentebegrafenis
  status: open
- nummer: 2
  domein: Gemeentebegrafenissen
  entiteit: Gemeentebegrafenis
  type: scope
  bevinding: Gemeentebegrafenis staat onder 6 Sociaal Domein. De lijkbezorging (graf, grafrecht, begraafplaats, gemeentebegrafenis) hoort bij Iv3-taakveld 7.5 Begraafplaatsen en crematoria (7 Volksgezondheid en Milieu); deze wiki plaatst het element daar. Overweeg een beleidsdomein Begraafplaatsen en crematoria, waarin ook de hiaten graf en grafrecht passen.
  element: gemeentebegrafenis
  status: open
- nummer: 3
  domein: Begraafplaatsen en crematoria
  entiteit: null
  type: hiaat
  bevinding: 'Graf ontbreekt in het GGM, terwijl Gemeentebegrafenis er wel naar verwijst (attribuut datumRuimingGraf). Als houder van de gemeentelijke begraafplaats geeft de gemeente graven uit, opent en sluit ze en ruimt ze (Wet op de lijkbezorging art. 23, 27, 31; beheersverordening Groningen art. 7, 11-16, 27). Relevante attributen: grafsoort (algemeen, particulier, kinder-, urnengraf, urnennis, partnergraf), ligging (vak, nummer), aantal grafruimtes, datum laatste begraving (ruimtermijn tien jaar), en per graf de begraven lijken en bijgezette urnen met datum (register van begraven lijken, art. 27). Past in een beleidsdomein Begraafplaatsen en crematoria, naast Gemeentebegrafenis.'
  element: graf
  status: open
- nummer: 4
  domein: Begraafplaatsen en crematoria
  entiteit: null
  type: hiaat
  bevinding: 'Grafrecht (uitsluitend recht op een graf, art. 28) ontbreekt in het GGM. Het recht wordt schriftelijk gevestigd voor onbepaalde tijd of ten minste tien jaar, verlengd, overgeschreven en kan vervallen of vervallen worden verklaard (Wet op de lijkbezorging art. 28; beheersverordening Groningen art. 16, 18-20); gemeenten heffen er lijkbezorgingsrechten voor. Relevante attributen: rechthebbende, graf, ingangsdatum, looptijd, verlengingen, overschrijvingen, datum verval en reden. Past in een beleidsdomein Begraafplaatsen en crematoria.'
  element: grafrecht
  status: open
- nummer: 5
  domein: Generiek Jeugd en Wmo
  entiteit: Beschikking
  type: duplicaat
  bevinding: 'Beschikking komt twee keer voor met verschillende GUID''s: Generiek Jeugd en Wmo (EAID_71D7E96D_641A_4b6a_A325_DED07C3B5836, gekoppeld aan GEMMA-bedrijfsobject Beschikking) en Diensten (EAID_16ABCFF8_4817_6A73_59BA_281C3303F8D2, ''een voor beroep vatbaar overheidsbesluit''). Het is hetzelfde bestuursrechtelijke begrip; samenvoegen tot één generieke entiteit. De definitie van Generiek Jeugd en Wmo omvat ook de civielrechtelijke beschikking (rechterlijke uitspraak), die daarbij beter kan vervallen.'
  element: beschikking
  status: open
- nummer: 6
  domein: RGBZPlus
  entiteit: Besluit
  type: definitie
  bevinding: 'De GGM-definitie van Besluit (''een na overweging of beraadslaging vastgestelde beslissing voor een individueel of concreet geval'') beschrijft een beschikking. Volgens de Awb is een besluit een schriftelijke beslissing van een bestuursorgaan, inhoudende een publiekrechtelijke rechtshandeling (art. 1:3 lid 1), en omvat het ook besluiten van algemene strekking; een beschikking is een besluit dat niet van algemene strekking is (art. 1:3 lid 2). Voorstel: de Awb-definitie overnemen.'
  element: besluit
  status: open
- nummer: 7
  domein: RGBZPlus
  entiteit: Besluit
  type: duplicaat
  bevinding: 'Besluit komt twee keer voor met verschillende GUID''s en dezelfde definitie: RGBZPlus (99 Kern, EAID_AFB100D2_8C68_4488_8949_13E945D15920, gekoppeld aan GEMMA-bedrijfsobject Besluit) en Diensten (Inkomen, EAID_0CA08ED2_6990_8292_BBC7_281C33037374). Samenvoegen tot de domeinoverstijgende entiteit in RGBZPlus.'
  element: besluit
  status: open
- nummer: 8
  domein: RGBZPlus
  entiteit: Beschikking
  type: structuur
  bevinding: 'Beschikking is een domeinoverstijgend begrip: een besluit dat niet van algemene strekking is (Awb art. 1:3 lid 2). Het GGM kent Beschikking alleen in de beleidsdomeinen Generiek Jeugd en Wmo en Diensten (zie terugmelding 5), en niet als generalisatie-specialisatie van Besluit. Voorstel: één domeinoverstijgende entiteit Beschikking in RGBZPlus (99 Kern), als specialisatie van Besluit, waarnaar de domeinspecifieke beschikkingen verwijzen.'
  element: beschikking
  status: open
- nummer: 9
  domein: Musea
  entiteit: Belanghebbende
  type: scope
  bevinding: 'Belanghebbende (definitie gelijk aan art. 1:2 Awb) is een algemeen begrip uit het bestuursrecht, maar staat in het GGM alleen in het beleidsdomein Musea. Voorstel: onderbrengen in een algemeen beleidsdomein (bijvoorbeeld Kern of Besluitvorming), zodat alle beleidsdomeinen ernaar kunnen verwijzen.'
  element: belanghebbende
  status: open
- domein: Model Inkomen
  entiteit: Regeling
  type: homoniem
  bevinding: 'Het GGM gebruikt de naam Regeling voor een afspraak of regeling met een cliënt (Terug- en invordering, Diensten, Model Inkomen), terwijl GEMMA en het spraakgebruik Regeling gebruiken voor de soort wet of verordening (algemeen verbindend voorschrift; Gemeentewet art. 147, 149). Voorstel: de GGM-entiteiten een specifiekere naam geven, bijvoorbeeld Cliëntregeling of Betalingsregeling, en in alle drie de domeinen dezelfde naam gebruiken.'
  element: regeling
  nummer: 10
  status: open
- domein: Archief
  entiteit: Rechthebbende
  type: homoniem
  bevinding: 'Het GGM gebruikt Rechthebbende in Archief voor iemand die rechten heeft op een goed. De Wet op de lijkbezorging en de beheersverordeningen gebruiken rechthebbende voor wie het uitsluitend recht op een particulier graf heeft (art. 23, 28). Deze wiki noemt dat element Rechthebbende op het graf. Voorstel: de GGM-definitie in Archief verbijzonderen (rechthebbende op archiefbescheiden), zodat de algemene naam niet aan één domein vastzit.'
  element: rechthebbende-op-het-graf
  nummer: 11
  status: open
