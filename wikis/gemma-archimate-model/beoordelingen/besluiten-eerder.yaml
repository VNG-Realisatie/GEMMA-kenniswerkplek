  begrip: Wet BRP, Besluit BRP
  onderwerp: burgerzaken
  besluit: Opnemen als beleidskader; grondslag van de BRP-diensten en -deelprocessen.
  stand: geldt
- datum: '2026-10-07'
  begrip: Akte van de burgerlijke stand, Reisdocument
  onderwerp: burgerzaken
  besluit: Kandidaat tot plak 2 en 3, waar een proces ze als kernobject krijgt; de akte wordt dan gegevensobject zonder GGM-entiteit (GGM-terugmelding 12).
  stand: 'herzien door 2026-10-07: Akte van de burgerlijke stand opgenomen, Reisdocument kernobject'
- datum: '2026-10-07'
  begrip: Minister van BZK
  onderwerp: burgerzaken
  besluit: 'Geen element, in lijn met plak 1: één organisatie van het Rijk, geen soort partij; zijn registers zijn invoer en hij staat in de beschrijvingen. De rijkskant (minister/RvIG, IND) eventueel in één keer zichtbaar maken bij plak 4.'
  stand: aangevuld door 2026-10-07 (Rijk, Minister van BZK, Immigratie- en Naturalisatiedienst)
- datum: '2026-10-07'
  begrip: Reisdocument, Beheren reisdocumenten
  onderwerp: burgerzaken
  besluit: 'Reisdocument is kernobject van het nieuwe bedrijfsproces Beheren reisdocumenten onder Verzorgen burgerzaken (geen ketenproces: de minister voert tegenover de houder geen eigen deel uit), met de deelprocessen voor aanvraag, aanvraag niet-ingezetene, uitreiking, vermissing, inhouding en vervallenverklaring; de documentsoorten zijn specialisaties zonder pagina met de wetsterm, de diensten houden de UPL-naam.'
  stand: 'deels herzien door 2026-10-08: de taak Verzorgen burgerzaken vervalt; Beheren reisdocumenten is levensloopproces'
- datum: '2026-10-07'
  begrip: Rijk, Minister van BZK, Immigratie- en Naturalisatiedienst
  onderwerp: algemeen
  besluit: 'Rijkskant: één actor Rijk (GEMMA-actor Rijk, exacte match; de export vult de lege GEMMA-definitie), thuis in Algemeen, die de rol Ketenpartner vervult in het ketenproces Beheren Nederlanderschap. De afzonderlijke ministers en rijksdiensten (minister van BZK met de RvIG, minister van JenV met de IND) zijn geen eigen actor en staan in de beschrijving van Rijk.'
  stand: geldt
- datum: '2026-10-07'
  begrip: Rijkswet op het Nederlanderschap, Besluit verkrijging en verlies Nederlanderschap, Kieswet
  onderwerp: burgerzaken
  besluit: Opnemen als beleidskader; grondslag van Beheren Nederlanderschap (optie, naturalisatie, afstand) en van Beheren stempassen en Registreren kiesgerechtigdheid.
  stand: geldt
- datum: '2026-10-07'
  begrip: Beheren stempassen, Registreren kiesgerechtigdheid
  onderwerp: burgerzaken
  besluit: Stempas is kernobject van het bedrijfsproces Beheren stempassen onder Verzorgen burgerzaken (stempas, kiezerspas, volmacht); de registratie van de kiesgerechtigdheid is een deelproces van Bijhouden persoonsgegevens. Geen kunstmatig object Kiezersregistratie.
  stand: 'deels herzien door 2026-10-08: de taak Verzorgen burgerzaken vervalt; Beheren stempassen is levensloopproces'
- datum: '2026-10-07'
  begrip: Rijbewijs, Verklaring omtrent het gedrag (VOG)
  onderwerp: burgerzaken
  besluit: 'Binnen Burgerzaken (plak 5), niet een later onderwerp: UPL 360-363 en 434 staan onder 0.2 en op de Utrecht-hubpagina. Rijbewijs is gegevensobject zonder GGM-entiteit en kernobject van het bedrijfsproces Beheren rijbewijzen (de burgemeester besluit tot afgifte; RDW en CBR zijn producent en bron van invoer, geen eigen actor; de omwisseling van een buitenlands rijbewijs is een deelproces waarin de gemeente doorgeleidt, GGM-terugmelding 18). De VOG is kernobject van het ketenproces Afgeven verklaring omtrent het gedrag, met het Rijk (de minister van JenV) als Ketenpartner, zonder GGM-terugmelding. Beleidskaders: Wegenverkeerswet 1994, Reglement rijbewijzen en Wet justitiële en strafvorderlijke gegevens; het Besluit justitiële en strafvorderlijke gegevens is bron.'
  stand: 'deels herzien door 2026-10-08: de VOG is orkestratie, geen ketenproces'
- datum: '2026-10-07'
  begrip: Afronding Burgerzaken
  onderwerp: burgerzaken
  besluit: 'Alle UPL-regels onder 0.2 en alle Utrecht-pagina''s hebben een element of een vastgelegde uitkomst. Verwijzingen (geen element) naar latere onderwerpen: verkiezingsorganisatie (UPL 205, 395, 396), openbare ruimte (243-246), Overlijdensuitkering, Reclamesticker en Contactgegevens aanpassing. Het synoniem Doorgever bij Aangever vervalt (geen bron). De namen Akte van de burgerlijke stand, Wet en Besluit basisregistratie personen, Besluit burgerlijke stand 1994 en Verkiezingen gerelateerde diensten blijven, toegelicht in `naamkeuze`. Er is geen Product in Burgerzaken; de beleidskaders hangen aan de UPL-diensten en deelprocessen, met toelichting. Regeling BRP blijft bron. Overlijden blijft thuis in Burgerzaken. De diensten Rijbewijs aanvragen en Verklaring omtrent gedrag aanvragen krijgen de UPL-naam als synoniem (precedent Briefadres aanvragen). Tegenspraak vastgelegd: proces-verbaal bij vermissing (Reglement art. 39) tegenover vermissingsverklaring (Utrecht).'
  stand: geldt
- datum: '2026-10-07'
  begrip: Behandelen verkrijging en verlies Nederlanderschap
  onderwerp: burgerzaken
  besluit: Nieuw bedrijfsproces voor het deel van de gemeente binnen Beheren Nederlanderschap, met alle vier de deelprocessen (optieverklaring, naturalisatieverzoek, naturalisatieceremonie, verklaring van afstand); de indeling 2+2 vervalt. De toegang-relaties naar Nederlanderschap en Ingeschreven persoon verhuizen van het ketenproces; de gebeurtenissen, Ketenpartner, de functie en de Rijkswet blijven bij het ketenproces. Naam naar de titel van het Besluit verkrijging en verlies Nederlanderschap; Behandelen verzoeken en verklaringen Nederlanderschap is afgewezen omdat de ceremonie geen verzoek of verklaring is.
  stand: 'herzien door 2026-10-08: samengevoegd in Beheren Nederlanderschap'
- datum: '2026-10-07'
  begrip: Toestaan lijkbezorging, Begraven en cremeren stoffelijk overschot
  onderwerp: lijkbezorging
  besluit: 'Bezorgen stoffelijk overschot per partij in de keten, met de gemeente in de hoedanigheid waarin ze optreedt: Toestaan lijkbezorging (de gemeente als overheid: Schouwen, Verlenen verlof tot begraving of crematie, Stellen andere termijn, Verlenen verlof tot ontleding, Afgeven laissez-passer, Verlenen toestemming asverstrooiing, Opgraven, Treffen maatregel bij besmet stoffelijk overschot) en Begraven en cremeren stoffelijk overschot (de houder van de begraafplaats of het crematorium: Uitvoeren lijkbezorging, Bijzetten of verstrooien van de as); Verzorgen gemeentebegrafenis blijft. Een groep arts vervalt: in het model schouwt alleen de gemeentelijke lijkschouwer, die de gemeente benoemt (Wlb art. 3, 4). Afgewezen: één gemeentelijk deel met alle tien (bijna gelijk aan het ketenproces, mengt overheid en houder) en fasegroepen (volgen de fase, niet de partij). Namen: Toezien op lijkbezorging afgewezen (homoniem met toezicht), Bezorgen en bestemmen afgewezen (bijna de naam van het ketenproces).'
  stand: 'deels herzien door 2026-10-08: levensloopprocessen die de bedrijfsinteractie Bezorgen stoffelijk overschot bedienen'
- datum: '2026-10-08'
  begrip: Stoffelijk overschot, Toestaan lijkbezorging, Begraven en cremeren stoffelijk overschot
  onderwerp: lijkbezorging
  besluit: 'Eén levensloopproces per partij: Toestaan lijkbezorging (de gemeente als overheid) en Begraven en cremeren stoffelijk overschot (de houder) blijven allebei levensloopproces van Stoffelijk overschot. Afgewezen: één levensloopproces Bezorgen stoffelijk overschot met de tien bedrijfsprocessen, en Toestaan lijkbezorging als enige levensloopproces.'
  stand: geldt
- datum: '2026-10-08'
  begrip: Beheren Nederlanderschap, Behandelen verkrijging en verlies Nederlanderschap
  onderwerp: burgerzaken
  besluit: 'Geen interactie: bij optie en afstand beslist de burgemeester zelf, bij de naturalisatie voert de gemeente delen uit voor de minister (orkestratie). Beheren Nederlanderschap blijft het levensloopproces met zijn object en aggregeert de vier bedrijfsprocessen; Behandelen verkrijging en verlies Nederlanderschap vervalt, samengevoegd. Behandelen naturalisatieverzoek en Houden naturalisatieceremonie specialiseren *Leveren dienst aan derden*.'
  stand: geldt
- datum: '2026-10-08'
  begrip: Verval van het reisdocument, Inhouden reisdocument, Vervallen verklaren reisdocument, Inlevering van het reisdocument
  onderwerp: burgerzaken
  besluit: 'Het verval van rechtswege triggert de inhouding niet. Nieuwe gebeurtenis Inlevering van het reisdocument (wetsterm, Paspoortwet art. 56) triggert Inhouden reisdocument, het bedrijfsproces voor elke inlevering (teruggevonden vermist, vervallen, beschadigd of gesignaleerd document, art. 54). Vervallen verklaren reisdocument wordt daarin een deelproces, alleen na een signalering (art. 44, 53). Verwerken vermissing reisdocument eindigt bij de registratie en het verval (art. 47 lid 1 onder j). Afgewezen: de vervallenverklaring onder Verwerken vermissing (een vermist document vervalt van rechtswege), en de inlevering van een teruggevonden document als tweede gebeurtenis van Verwerken vermissing (het inhouden zou dan op twee plaatsen staan).'
  stand: geldt
- datum: '2026-10-08'
  begrip: Behandelen melding voorgenomen huwelijk of partnerschap, Voltrekken huwelijk, Registreren partnerschap
  onderwerp: burgerzaken
  besluit: 'De klant wil trouwen of een partnerschap laten registreren: Voltrekken huwelijk en Registreren partnerschap zijn de bedrijfsprocessen, van de melding tot de akte; de melding wordt van beide een deelproces zonder pagina, de diensten van de melding gaan naar die bedrijfsprocessen en het Archi-object vervalt. Afgewezen: alle drie bedrijfsproces.'
  stand: geldt
- datum: '2026-10-08'
  begrip: Overlijden, Schouwen stoffelijk overschot, Bijzetten of verstrooien van de as
  onderwerp: lijkbezorging
  besluit: 'Overlijden leidt tot de akte (Opmaken akte van overlijden, daarna Verlenen verlof) en tot het begraven of cremeren (Uitvoeren lijkbezorging). Bijzetten of verstrooien van de as wordt een deelproces van Uitvoeren lijkbezorging. Schouwen stoffelijk overschot blijft een eigen bedrijfsproces (de schouw gebeurt vóór de aangifte en de aanvraag van het verlof, door een andere rol); de verklaring van overlijden gaat als stroom naar Verlenen verlof (Wlb art. 12). Afgewezen: Schouwen als deelproces van Verlenen verlof.'
  stand: geldt
- datum: '2026-10-08'
  begrip: Producten- en dienstenrealisatie veiligheidsdomein, Uitvoering openbare orde en veiligheid
  onderwerp: lijkbezorging
  besluit: 'Vervallen in de wiki: ze omvatten alleen Asverstrooiing, die geen landelijke grondslag en geen proces heeft; Asverstrooiing gaat naar Exploiteren van begraafplaatsen. Besluit 5 blijft, met een aanvulling (besluit 12 in analyses/wettelijke-grondslag.md). De GEMMA-elementen blijven; voorstel in GEMMA-terugmelding 1, in een nieuw register van GEMMA-terugmeldingen met de opbouw van de GGM- en procesarchitectuur-terugmeldingen.'
  stand: geldt; GEMMA-terugmelding 1
