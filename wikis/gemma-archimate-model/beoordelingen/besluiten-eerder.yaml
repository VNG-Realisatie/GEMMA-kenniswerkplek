- datum: '2026-10-04'
  begrip: Treffen maatregel bij besmet lijk, Verlenen grafrecht, Onderhouden graf
  onderwerp: lijkbezorging
  besluit: 'Specialiseren zelf een GEMMA-proces: *Behandelen melding*, *Behandelen aanvraag product* en *Onderhouden*. Vervallen verklaren grafrecht niet naar *Opleggen sanctie*: het verval volgt uit de afspraak, niet uit handhaving.'
  stand: geldt; Onderhouden graf vervallen 2026-10-08 (regel Wettelijke grondslag)
- datum: '2026-10-04'
  begrip: Indelingsvelden
  onderwerp: lijkbezorging
  besluit: 'Doelgroep, domein, afnemer en regelgever zoals voorgesteld: onder meer de houder-rollen en de gemeentelijke lijkschouwer *gemeente*, Kerkgenootschap en Adviseur *ketenpartners*, Uitvaartondernemer *inwoners en ondernemers*, Uitvaart vervroegen of uitstellen *Publieksdiensten*, alle processen en diensten *extern*.'
  stand: geldt
- datum: '2026-10-05'
  begrip: UPL-producten van lijkbezorging
  onderwerp: lijkbezorging
  besluit: 'Toets per UPL-product volgens de GEMMA-definities: een product als het een dienst met een afspraak bundelt (Grafuitgifte: Graf aanvragen en Grafrecht), anders een dienst die een deelproces realiseert. Het tarief grafrechten is een specialisatie van Heffing; overlijdensaangifte, overlijdensakte en doodgeboren kind aangifte horen bij het onderwerp burgerlijke stand. Nieuw: product Grafuitgifte, zeven diensten en vier deelprocessen (Verlenen vergunning grafbedekking, Verlenen toestemming asverstrooiing, Verlenen verlof tot ontleding, Afgeven laissez-passer).'
  stand: geldt
- datum: '2026-10-05'
  begrip: Stoffelijk overschot in lopende tekst
  onderwerp: lijkbezorging
  besluit: 'Per element beoordeeld (19 elementen): in definitie, beschrijving en tekst per onderwerp wordt lijk stoffelijk overschot, ook waar een zin de inhoud van een register beschrijft (Graf, Houder van het crematorium). Blijven staan: de wetsterm waar het over het begrip zelf gaat (Wet op de lijkbezorging: "bepaalt wat een lijk is"), de vaste termen lijkbezorging, lijkschouwing, lijkschouwer en laissez-passer voor lijken, het begrip Register van begraven lijken en synoniemen met context wet. Maatregel bij besmet lijk (specialisatie van Beschikking, geen pagina) heet Maatregel bij besmet stoffelijk overschot.'
  stand: geldt
- datum: '2026-10-06'
  begrip: Afbakening Burgerzaken
  onderwerp: burgerzaken
  besluit: Eén onderwerp; producten en diensten uit Utrecht en de UPL onder 0.2; het Logisch Ontwerp BRP en de HUP alleen op object- en gebeurtenisniveau; Kieswet en Rijkswet alleen de gemeentelijke taak. Producten waar de gemeente een eigen handeling heeft, worden opgenomen ook als de rechtbank beslist; varianten zijn een apart product waar de UPL ze apart noemt; de wetsterm is een synoniem van de gangbare naam; adresonderzoek, verwijdering of overschrijving (art. 2.57), levenloos geboren kind (art. 2.56a) en correctieverzoek (art. 2.58 e.v.) worden als deelproces beoordeeld; de volmacht is een dienst, het bewijs een onderdeel; de gemeentelijke rol bij de Rijkswet komt uit het Besluit verkrijging en verlies Nederlanderschap.
  stand: geldt
- datum: '2026-10-06'
  begrip: Onderwerp Algemeen
  onderwerp: algemeen
  besluit: 'Nu een licht onderwerp Algemeen voor de generieke elementen en de organen en organisatie van de gemeente, vóór Burgerzaken: nog geen eigen bronnen en geen herbeoordeling; bestaande elementen verhuizen per geval door `algemeen` als eerste in `onderwerpen` te zetten.'
  stand: geldt
- datum: '2026-10-06'
  begrip: Generieke elementen en organen naar Algemeen
  onderwerp: algemeen
  besluit: 'Per geval beoordeeld en verplaatst door `algemeen` als eerste in `onderwerpen` te zetten: de generieke elementen Besluit, Beschikking, Vergunning, Heffing, Heffingsverordening en Regeling en de organen Gemeente, Gemeenteraad, College van B&W en Burgemeester (regel Thuishoren). Lijkbezorging blijft tweede onderwerp met de tekst per onderwerp; de objecten in Archi blijven. De tien beoordelingen zijn weer `review`. Beslisser en Belanghebbende blijven nog voorgelegd.'
  stand: geldt; Belanghebbende open (todo.md)
- datum: '2026-10-06'
  begrip: Homoniemen Andere termijn en Laissez-passer voor lijken
  onderwerp: lijkbezorging
  besluit: 'Vastgelegd als homoniemen (regel Eén element in het hele model): het besluit of document zelf is een specialisatie zonder pagina (van Beschikking, van Vergunning), de dienst heet Uitvaart vervroegen of uitstellen en Vervoersdocumenten stoffelijk overschot en houdt de term als synoniem (wet).'
  stand: geldt
- datum: '2026-10-06'
  begrip: Beslisser
  onderwerp: algemeen
  besluit: 'Generiek: de GEMMA-rol Beslisser geldt in elk onderwerp en verhuist naar Algemeen (`algemeen` eerste in `onderwerpen`). Het kenmerk *generiek* blijft nee: Beslisser is zelf de generieke GEMMA-rol, geen variant daarvan. Belanghebbende hoort ook bij Algemeen; die beoordeling volgt (nog een verwijzing).'
  stand: geldt
- datum: '2026-10-07'
  begrip: Producten- en dienstenrealisatie publieksdiensten
  onderwerp: algemeen
  besluit: 'Naar Algemeen (`algemeen` eerste in `onderwerpen`): generieke functie voor de publieksdiensten van alle onderwerpen; Lijkbezorging en Burgerzaken houden hun tekst per onderwerp.'
  stand: geldt
