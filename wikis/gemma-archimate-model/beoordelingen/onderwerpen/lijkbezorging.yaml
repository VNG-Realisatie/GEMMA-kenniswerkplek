besluiten:
- datum: '2026-10-04'
  besluit: 'Beleidsdomein Begraafplaatsen en crematoria: Voorstel aan GEMMA en GGM: een beleidsdomein *Begraafplaatsen en crematoria* onder taakveld 7 (Iv3 7.5). De export maakt de groepering in de wiki-map voor de objecten, producten en beleidskaders van lijkbezorging. Gemeentebegrafenis blijft daarnaast in het GGM-beleidsdomein Gemeentebegrafenissen.'
  stand: geldt; procesarchitectuur-terugmelding 1
- datum: '2026-10-04'
  besluit: 'Indelingsvelden: Doelgroep, domein, afnemer en regelgever zoals voorgesteld: onder meer de houder-rollen en de gemeentelijke lijkschouwer *gemeente*, Kerkgenootschap en Adviseur *ketenpartners*, Uitvaartondernemer *inwoners en ondernemers*, Uitvaart vervroegen of uitstellen *Publieksdiensten*, alle processen en diensten *extern*.'
- datum: '2026-10-05'
  besluit: 'UPL-producten van lijkbezorging: Toets per UPL-product volgens de GEMMA-definities: een product als het een dienst met een afspraak bundelt (Grafuitgifte: Graf aanvragen en Grafrecht), anders een dienst die een deelproces realiseert. Het tarief grafrechten is een specialisatie van Heffing; overlijdensaangifte, overlijdensakte en doodgeboren kind aangifte horen bij het onderwerp burgerlijke stand. Nieuw: product Grafuitgifte, zeven diensten en vier deelprocessen (Verlenen vergunning grafbedekking, Verlenen toestemming asverstrooiing, Verlenen verlof tot ontleding, Afgeven laissez-passer).'
- datum: '2026-10-05'
  besluit: 'Stoffelijk overschot in lopende tekst: Per element beoordeeld (19 elementen): in definitie, beschrijving en tekst per onderwerp wordt lijk stoffelijk overschot, ook waar een zin de inhoud van een register beschrijft (Graf, Houder van het crematorium). Blijven staan: de wetsterm waar het over het begrip zelf gaat (Wet op de lijkbezorging: "bepaalt wat een lijk is"), de vaste termen lijkbezorging, lijkschouwing, lijkschouwer en laissez-passer voor lijken, het begrip Register van begraven lijken en synoniemen met context wet. Maatregel bij besmet lijk (specialisatie van Beschikking, geen pagina) heet Maatregel bij besmet stoffelijk overschot.'
