- type: product
  elementen:
  - naturalisatieoptie
  bevinding:
  - '**UPL:** het product heet naturalisatieoptie, met grondslag art. 6 Rijkswet op het Nederlanderschap (2025-vng-upl-producten-en-diensten-extern, nr. 262).'
  - '**GEMMA:** optie en naturalisatie zijn twee wegen tot verkrijging van het Nederlanderschap, met een andere beslisser en procedure: bij optie beslist de burgemeester, bij naturalisatie de Koning op voordracht van de minister (2026-rijk-besluit-verkrijging-verlies-nederlanderschap-bwbr0013605, art. 1 onder c en d; 2026-utrecht-burgerzaken-nederlander-worden-door-naturalisatie-of-optie). In het model heet de dienst letterlijk Naturalisatieoptie, met de synoniem Nederlander worden door optie; voorstel: de UPL-naam optie of optieverklaring.'
