  elementen:
  - zakenpaspoort
  bevinding:
  - '**UPL:** zakenpaspoort heeft als grondslag art. 3 Paspoortuitvoeringsregeling Buitenland 2001 (2025-vng-upl-producten-en-diensten-extern, nr. 494).'
  - '**GEMMA:** de gemeente verstrekt het zakenpaspoort als gewoon paspoort met 66 in plaats van 34 bladzijden (2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-aanvragen); de Paspoortwet kent het niet als eigen soort en de HUP geeft het de letter B in het documentnummer (2026-rvig-hup-uitreiking-registreren-van-een-reisdocument). Een regeling voor aanvragen in het buitenland is geen grondslag voor de gemeentelijke dienst. In het model is de dienst Zakenpaspoort een aanvraag van een nationaal paspoort; de grondslag is de Paspoortwet (art. 26, 40).'
