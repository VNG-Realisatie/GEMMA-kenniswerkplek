  bevinding:
  - '**UPL:** de producten heten rijbewijs (nr. 360) en verklaring omtrent gedrag (vog) (nr. 434) (2025-vng-upl-producten-en-diensten-extern).'
  - '**GEMMA:** beide zijn ook een bedrijfsobject, Rijbewijs en Verklaring omtrent het gedrag, en het kernobject van Beheren rijbewijzen en Afgeven verklaring omtrent het gedrag. De diensten heten daarom Rijbewijs aanvragen en Verklaring omtrent gedrag aanvragen, met de UPL-naam als synoniem, zoals Briefadres aanvragen en Stempas ontvangen (2026-rijk-wegenverkeerswet-1994-bwbr0006622, art. 116; 2026-rijk-wet-justitiele-en-strafvorderlijke-gegevens-bwbr0014194, art. 28).'
