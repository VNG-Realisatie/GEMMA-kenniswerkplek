  bevinding:
  - '**UPL:** de UPL kent geen product voor het melden van de vermissing of diefstal van een rijbewijs (2025-vng-upl-producten-en-diensten-extern).'
  - '**GEMMA:** gemeenten bieden het aan als eigen product: het doorgeven van de vermissing aan de balie, op afspraak of bij een nieuwe aanvraag, naast het online doorgeven bij de RDW (2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen; 2026-rijk-wegenverkeerswet-1994-bwbr0006622, art. 123 lid 1 onder h). In het model is het de dienst Vermissing of diefstal rijbewijs doorgeven, gerealiseerd door Verwerken vermissing rijbewijs.'
  nummer: 17
  status: open
- type: product
  elementen:
  - rijbewijs-aanvragen
  - behandelen-aanvraag-rijbewijs
  bevinding:
  - '**UPL:** het product rijbewijs gezondheidsverklaring (nr. 362) staat als zelfstandig product onder taakveld 0.2, met als grondslag art. 100 Reglement rijbewijzen (2025-vng-upl-producten-en-diensten-extern).'
  - '**GEMMA:** de gezondheidsverklaring is geen zelfstandige dienst maar een onderdeel (subdienst) van het besluit over de aanvraag van een rijbewijs, want de gemeente heeft er geen eigen handeling voor. Art. 100 gaat over de aanvraag van een verklaring van geschiktheid bij het CBR: de aanvrager overlegt de gezondheidsverklaring aan het CBR, dat de verklaring registreert (2026-rijk-reglement-rijbewijzen-bwbr0008074, art. 97, 100). De gemeente verkoopt of ontvangt geen gezondheidsverklaring (2026-utrecht-burgerzaken-gezondheidsverklaring-en-medische-keuring-voor-rijbewijs) en controleert alleen als onderdeel van Behandelen aanvraag rijbewijs of een vereiste verklaring van geschiktheid is geregistreerd (art. 35, 45). In het model is het daarom geen element: het begrip staat in de begrippenlijst als onderdeel van de dienst Rijbewijs aanvragen en van het deelproces Behandelen aanvraag rijbewijs; voorstel: de UPL laat het product vervallen of beschrijft het als onderdeel van het product rijbewijs, met art. 35 en 45 als grondslag.'
  nummer: 18
  status: open
- type: grondslag
  elementen:
  - rijbewijs-aanvragen
  - verklaring-omtrent-gedrag-aanvragen
  bevinding:
  - '**UPL:** de grondslag van rijbewijs (nr. 360) is art. 26 Reglement rijbewijzen en die van verklaring omtrent gedrag (vog) (nr. 434) art. 28 Wet justitiële en strafvorderlijke gegevens (2025-vng-upl-producten-en-diensten-extern).'
  - '**GEMMA:** art. 26 Reglement rijbewijzen zegt alleen dat de aanvraag volgens de volgende artikelen geschiedt; de bevoegdheid van de burgemeester tot afgifte staat in art. 116 lid 1 Wegenverkeerswet 1994 en art. 27 Reglement (2026-rijk-reglement-rijbewijzen-bwbr0008074; 2026-rijk-wegenverkeerswet-1994-bwbr0006622). Art. 28 Wjsg definieert de VOG; de gemeentelijke taak (ontvangen, controleren, doorzenden, vergoeding) staat in art. 30 en 39 (2026-rijk-wet-justitiele-en-strafvorderlijke-gegevens-bwbr0014194). In het model zijn de Wegenverkeerswet 1994, het Reglement rijbewijzen en de Wjsg beleidskaders; voorstel: art. 116 Wegenverkeerswet 1994 en art. 27 Reglement, en art. 30 en 39 Wjsg als grondslag toevoegen.'
  nummer: 19
