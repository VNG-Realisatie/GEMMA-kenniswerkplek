  bevinding:
  - '**UPL:** de producten van de lijkbezorging vallen in drie GEMMA-domeinen (2025-vng-upl-producten-en-diensten-extern):'
  - '- Fysieke leefomgeving: grafuitgifte, grafonderhoud, gedenkteken plaatsingsvergunning, herbegraven of alsnog cremeren, verlof tot begraven, ontleding stoffelijk overschot toestemming, vervoersdocumenten stoffelijk overschot, crematoriumregister en bijzettingenregister;'
  - '- Publieksdiensten: begraafplaatsregister en bijzondere begraafplaats toestemming;'
  - '- Openbare orde en veiligheid: asverstrooiing.'
  - 'Verwante producten komen zo in verschillende domeinen terecht: het begraafplaatsregister bij Publieksdiensten, het crematorium- en het bijzettingenregister bij Fysieke leefomgeving. In het GEMMA-model valt het verwante beleidsdomein Gemeentebegrafenissen bovendien onder Sociaal domein.'
  - '**GEMMA:** alle producten en diensten van de lijkbezorging staan bij elkaar in één beleidsdomein, Begraafplaatsen en crematoria, onder taakveld 7 (Iv3 7.5). In de Functie-indeling naar domein houden ze het GEMMA-domein uit de UPL.'
