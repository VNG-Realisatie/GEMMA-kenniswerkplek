- type: grondslag
  elementen:
  - identiteitskaart
  bevinding:
  - '**UPL:** identiteitskaart heeft als grondslag art. 16a Paspoortwet (2025-vng-upl-producten-en-diensten-extern, nr. 186).'
  - '**GEMMA:** paragraaf 3A van de Paspoortwet, met art. 16a en 17 over de Nederlandse identiteitskaart, is per 2026-10-01 vervallen; de kaart heeft een eigen wet, de Wet op de Nederlandse identiteitskaart, waarnaar de Paspoortwet verwijst (2026-rijk-paspoortwet-bwbr0005212, art. 1 onder u, § 3A). In het model is de Wet op de Nederlandse identiteitskaart (2026-rijk-wet-op-de-nederlandse-identiteitskaart-bwbr0052951, art. 11, 15, 25) het beleidskader dat grondslag is van de dienst Identiteitskaart; de UPL kan de grondslag daarop aanpassen.'
