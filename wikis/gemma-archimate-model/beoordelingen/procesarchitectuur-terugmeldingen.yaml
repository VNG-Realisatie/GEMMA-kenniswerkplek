  elementen:
  - vermissing-of-diefstal-reisdocument-doorgeven
  - gewaarmerkte-kopie-reisdocument-aanvragen
  bevinding:
  - '**UPL:** de UPL kent geen product voor het melden van de vermissing of diefstal van een reisdocument en geen product voor het waarmerken van een kopie van een reisdocument (2025-vng-upl-producten-en-diensten-extern).'
  - '**GEMMA:** gemeenten bieden beide aan als eigen product: het doorgeven van vermissing of diefstal van een paspoort of identiteitskaart, online en gratis, waarna het document ongeldig is (2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-vermissing-of-diefstal-doorgeven; 2026-rijk-paspoortwet-bwbr0005212, art. 5a, 47 lid 1 onder j), en het waarmerken van een kopie van een Nederlands reisdocument aan de balie (2026-utrecht-burgerzaken-waarmerken-kopie-nederlands-reisdocument-aanvragen). In het model zijn het de diensten Vermissing of diefstal reisdocument doorgeven, gerealiseerd door Verwerken vermissing reisdocument, en Gewaarmerkte kopie reisdocument aanvragen, gerealiseerd door Producten- en dienstenrealisatie publieksdiensten.'
  nummer: 11
  status: open
- type: product
  elementen:
  - reisdocument-niet-ingezetene
  bevinding:
  - '**UPL:** de UPL kent onder taakveld 0.2 naast reisdocument niet-ingezetene (nr. 357, doelgroep burger) ook het product reisdocument (nr. 356), met dezelfde grondslag art. 4.2 Paspoortbesluit en zonder doelgroep (2025-vng-upl-producten-en-diensten-extern, nr. 356, 357).'
  - '**GEMMA:** art. 4.2 Paspoortbesluit gaat alleen over de verstrekking aan personen die niet als ingezetene in de BRP staan, door aangewezen gemeenten (2026-rijk-paspoortbesluit-bwbr0044308, art. 3.2, 4.2). Nr. 356 valt daarmee samen met nr. 357; de reisdocumenten van ingezetenen hebben elk een eigen product. In het model is reisdocument (nr. 356) een synoniem van de dienst Reisdocument niet-ingezetene, gerealiseerd door het deelproces Behandelen aanvraag reisdocument niet-ingezetene.'
  nummer: 12
