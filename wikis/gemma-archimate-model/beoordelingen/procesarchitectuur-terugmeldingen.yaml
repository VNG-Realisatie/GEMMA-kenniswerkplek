  bevinding:
  - '**Kennismodel:** een deelproces realiseert een deelservice: een onderdeel van een dienst, dat in verschillende bedrijfsprocessen wordt gebruikt maar geen dienst is die de organisatie aan de buitenwereld levert. De dienst zelf wordt gerealiseerd door een bedrijfsproces of ketenproces (2026-vng-over-gemma, regel 385, 398, 591, 603).'
  - '**GEMMA:** een deelproces realiseert de dienst van een UPL-product, bijvoorbeeld Verlenen verlof tot begraving of crematie de dienst Verlof tot begraven en Verlenen grafrecht de dienst Graf aanvragen. Het model heeft één bedrijfs- of ketenproces per kernobject (Beheren grafrechten, Beheren graven, Bezorgen stoffelijk overschot); daaronder levert elk deelproces één product of dienst. Eén bedrijfsproces per product maakt het model plat: een gemeente levert zo''n 500 externe en 215 interne producten en diensten (2025-vng-upl-producten-en-diensten-extern, 2025-vng-upl-producten-en-diensten-intern).'
  nummer: 4
  status: open
- type: kennismodel
  elementen:
  - bezorgen-stoffelijk-overschot
  - toestaan-lijkbezorging
  - begraven-en-cremeren-stoffelijk-overschot
  - beheren-nederlanderschap
  - behandelen-verkrijging-en-verlies-nederlanderschap
  - afgeven-verklaring-omtrent-het-gedrag
  - behandelen-aanvraag-verklaring-omtrent-het-gedrag
  bevinding:
  - '**Kennismodel:** een ketenproces is een samenhangend geheel van processen over afdelingen of organisaties en aggregeert bedrijfsprocessen; een bedrijfsproces is een reeks activiteiten die bijdraagt aan een specifiek resultaat en is opgebouwd uit deelprocessen, die elk binnen één organisatorische eenheid worden uitgevoerd (2026-vng-over-gemma, regel 564, 571, 573, 590, 605). Het kennismodel zegt niet wat een bedrijfsproces binnen een ketenproces afbakent.'
  - '**GEMMA:** een ketenproces aggregeert alleen bedrijfsprocessen, nooit rechtstreeks deelprocessen. Het ketenproces omvat de levensloop van één kernobject over de partijen heen; elk bedrijfsproces daarin omvat het deel van die levensloop dat één partij uitvoert, met hetzelfde kernobject, en aggregeert de deelprocessen van die partij. De partij kan ook de gemeente in een eigen hoedanigheid zijn. Zo heeft Bezorgen stoffelijk overschot de bedrijfsprocessen Toestaan lijkbezorging (de gemeente als overheid: schouwen, verlof, andere termijn, ontleding, laissez-passer, asverstrooiing, opgraving en maatregel bij besmetting), Begraven en cremeren stoffelijk overschot (de houder van de begraafplaats of het crematorium) en Verzorgen gemeentebegrafenis (2026-rijk-wet-op-de-lijkbezorging-wettekst, art. 3, 11, 21, 23, 49). Beheren Nederlanderschap heeft Behandelen verkrijging en verlies Nederlanderschap (de burgemeester; 2026-rijk-besluit-verkrijging-verlies-nederlanderschap-bwbr0013605, hoofdstuk II, III, IIIA en V), en Afgeven verklaring omtrent het gedrag heeft Behandelen aanvraag verklaring omtrent het gedrag (de burgemeester; 2026-rijk-wet-justitiele-en-strafvorderlijke-gegevens-bwbr0014194, art. 30). Het deel van een partij buiten de gemeente, zoals de minister of de behandelend arts, staat alleen in de beschrijving van het ketenproces. De levensloop staat niet in de GEMMA-definities; het is een criterium van dit model. Voorstel: neem in de definitie van bedrijfsproces op dat een bedrijfsproces binnen een ketenproces het deel van één partij is, en in die van ketenproces dat het geen deelprocessen rechtstreeks bevat.'
