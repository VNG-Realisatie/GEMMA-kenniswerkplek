  bevinding:
  - '**UPL:** het product stemrecht heeft als grondslag art. B 1-B 3 en Y 2 Kieswet (2025-vng-upl-producten-en-diensten-extern, nr. 398).'
  - '**GEMMA:** het kiesrecht is een recht van de persoon, geen prestatie van de gemeente. Wat de gemeente levert, is de registratie van de kiesgerechtigdheid en de mededeling op verzoek of iemand als kiezer is geregistreerd (2026-rijk-kieswet-bwbr0004627, art. D 1, D 5). In het model is Stemrecht de dienst die het deelproces Registreren kiesgerechtigdheid realiseert; voorstel: art. D 1 en D 5 als grondslag toevoegen.'
