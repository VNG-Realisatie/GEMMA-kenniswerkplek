definitie: Wet die de inrichting, de bestuursorganen, de bevoegdheden en de financiën van de gemeente regelt.
beschrijving:
- De Gemeentewet regelt de gemeenteraad, het college van burgemeester en wethouders en de burgemeester, hun bevoegdheden en de verordeningen van de raad (2026-rijk-gemeentewet-wettekst).
per_onderwerp:
  participatie:
  - De raad stelt een verordening vast met regels over het betrekken van ingezetenen en belanghebbenden bij de voorbereiding, uitvoering en evaluatie van gemeentelijk beleid; inspraak verloopt volgens afdeling 3.4 Awb, tenzij de verordening anders bepaalt; en de verordening bepaalt de voorwaarden waaronder ingezetenen en maatschappelijke partijen gemeentelijke taken kunnen uitvoeren (2026-rijk-gemeentewet-wettekst, art. 150, sinds 1 januari 2025).
