begrip: Vergunningenbeheer Publieksdiensten
vak: bedrijf/gedrag-intern
soort_gedrag: gegroepeerd_gedrag
onderwerpen:
- lijkbezorging
kenmerken:
  bedient_gedrag:
    waarde: ja
    naar:
    - stellen-andere-termijn
  gebruikt_objecten:
    waarde: ja
    onderbouwing: Legt de vergunning vast die nabestaanden aanvragen bij de gemeente waar de persoon is overleden (RVO, § Uitvaart vervroegen, § Uitvaart uitstellen).
    bronnen:
    - 2026-rvo-aangifte-en-akte-van-overlijden
  in_functie_indeling:
    waarde: ja
    onderbouwing: Onderwerp onder Producten- en dienstenrealisatie publieksdiensten (Uitvoering › Publieksdiensten) in de GEMMA-functie-indeling.
    gemma_relatie:
    - id-e9c3ffeb-f96c-4bcd-8e74-cf5c866bb1cc
  generiek:
    waarde: ja
    onderbouwing: 'Komt met dezelfde betekenis voor bij elke vergunning voor een lokale activiteit. Zo in de Model-APV: evenementen (art. 2:25), inzameling van geld of goederen (art. 5:13) en standplaatsen (art. 5:18).'
    bronnen:
    - 2023-vng-model-apv
definitie: Het beheren en verlenen van vergunningen voor diverse soorten lokale activiteiten.
beschrijving:
- De gemeente beheert en verleent vergunningen voor lokale activiteiten die inwoners en ondernemers aanvragen, zoals vergunningen op grond van het Burgerlijk Wetboek en de APV.
per_onderwerp:
  lijkbezorging:
  - Wie de uitvaart eerder dan 36 uur of later dan zes werkdagen na het overlijden wil laten plaatsvinden, heeft een vergunning nodig; de burgemeester geeft toestemming (RVO; Wet op de lijkbezorging art. 17).
