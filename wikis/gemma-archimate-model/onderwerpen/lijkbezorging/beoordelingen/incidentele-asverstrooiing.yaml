begrip: Incidentele asverstrooiing
vak: bedrijf/gedrag-intern
soort_gedrag: per_keer_doorlopen
kenmerken:
  afhankelijkheid:
    waarde: variant
    onderbouwing: 'Variant van Uitvoeren lijkbezorging: zelfde gegevens en behandeling, geen eigen levenscyclus.'
genoemd_begrip: Uitvoeren lijkbezorging
toelichting: 'Specialisatie zonder pagina van Uitvoeren lijkbezorging, in het deelproces Bijzetten of verstrooien van de as: het verstrooien zelf. Tegenspraak in de definitie: de beheersverordening spreekt van een plek die de gemeente aanwijst, op of buiten de begraafplaats (Groningen art. 1 m, 21); de APV van een plek die de overledene of nabestaande kiest, buiten een permanent daartoe bestemd terrein (APV Groningen art. 5:26). De toestemming hoort bij de dienst Asverstrooiing.'
onderwerpen:
- lijkbezorging
bronnen:
- 2023-groningen-beheersverordening-gemeentelijke-begraafplaatsen
