per_onderwerp:
  lijkbezorging:
  - 'Lijkbezorging gebruikt alleen afdeling 9, Verstrooiing (art. 5:35–5:37): het verbod op incidentele asverstrooiing op bepaalde plaatsen en de ontheffing door het college op verzoek van de nabestaande die zorgdraagt voor de asbus (art. 5:36 lid 3). Gemeenten kiezen tussen twee varianten of laten de afdeling weg (2025-groningen-algemene-plaatselijke-verordening, art. 5:27).'
