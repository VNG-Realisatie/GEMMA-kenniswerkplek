    onderbouwing: Geeft het college de taak de GGD in te stellen en advies te vragen (art. 14, 16), en de GGD de taak een melding van een besmet lijk door te geven (art. 21, 27). Geen van die taken voert de gemeente uit in een proces of dienst van dit onderwerp; de maatregel bij een besmet lijk rust op Wlb art. 22a.
