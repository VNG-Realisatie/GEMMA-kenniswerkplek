taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
definitie: Gedenkteken en grafbeplanting op een graf, gedenkplaats of verstrooiingsplaats.
beschrijving:
- Voor een grafbedekking is een vergunning van het college nodig, die de rechthebbende aanvraagt (Groningen art. 22; VNG-modelverordening art. 19). De rechthebbende onderhoudt haar, of laat dat tegen betaling door de gemeente doen (art. 23, 24). Na afloop van de termijn van het graf kan het college de grafbedekking verwijderen; ze vervalt dan aan de gemeente (art. 26). Zolang het graf niet geruimd mag worden, is wat erop geplaatst is eigendom van de rechthebbende (Wet op de lijkbezorging art. 32a).
