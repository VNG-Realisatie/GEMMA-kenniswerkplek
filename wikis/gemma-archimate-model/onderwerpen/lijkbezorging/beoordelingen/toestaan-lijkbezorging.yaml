  onderbouwing: Het GEMMA-model kent geen proces voor de lijkbezorging; Behandelen aanvraag vergunning of ontheffing is het generieke proces achter het cluster Behandelen vergunningaanvragen lijkbezorging, geen match voor dit deel van een ketensamenwerking. Nieuw voor GEMMA.
