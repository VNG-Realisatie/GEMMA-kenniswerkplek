taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
definitie: Houder waarin de as van een overledene wordt geborgen en wordt bewaard, bijgezet of verstrooid.
beschrijving:
- Na de crematie wordt de as geborgen in een of meer gesloten asbussen met naam en nummer (art. 58). De asbus wordt bijgezet in een graf, urnengraf, urnennis of bewaarplaats, verstrooid, aan de nabestaande meegegeven of naar het buitenland gezonden (art. 59, 62). Een sierurn is een voorwerp ter berging van een of meer asbussen (Groningen art. 1 x); in het gangbare gebruik heet het geheel urn (VNG retributies). De as zelf is de inhoud van de urn, geen eigen element.
synoniemen:
- naam: Asbus
  context: wet
- naam: Sierurn
  context: beleid
besluiten:
- datum: '2026-09-30'
  besluit: Naam Urn volgens het gangbare gebruik; asbus (wet, beheersverordening) is een synoniem. Een sierurn met meer asbussen is één urn.
  gevolg: verwerkt
- datum: '2026-10-04'
  besluit: Subobject van Lijk, met het deelproces Bijzetten of verstrooien van de as.
  gevolg: verwerkt
- datum: '2026-10-08'
  besluit: 'Herziet het besluit van 2026-10-04: geen subobject van Stoffelijk overschot, maar een eigen bedrijfsobject. De as is deel van het stoffelijk overschot, de urn is de houder ervan, met een eigen levensloop en register (Wlb art. 58, 59, 62, 65, 66). Het enige bedrijfsproces met Urn als kernobject, Verlenen toestemming asverstrooiing, vervalt (regel Wettelijke grondslag); bijzetten en verstrooien vallen in Uitvoeren lijkbezorging. De pagina en het object in Archi blijven.'
  gevolg: verwerkt
