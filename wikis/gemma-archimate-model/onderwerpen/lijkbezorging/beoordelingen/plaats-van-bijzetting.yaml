taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
definitie: Plaats waar urnen worden bijgezet, zoals een urnengraf, urnennis, crematorium of bewaarplaats.
beschrijving:
- Een asbus kan worden bijgezet in een crematorium, in of op een graf, op een begraafplaats of in een bewaarplaats (art. 62). De houder van de plaats van bijzetting houdt een openbaar register van de bijgezette asbussen en ruimt ze (art. 65, 66). Een bewaarplaats buiten crematorium of begraafplaats vergt een vergunning van burgemeester en wethouders (art. 64).
