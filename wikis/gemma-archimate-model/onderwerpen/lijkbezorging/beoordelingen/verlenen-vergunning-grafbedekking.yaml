  gevolg: afwijzen
toelichting: 'Vervalt: geen landelijke wettelijke grondslag. Het proces realiseerde de dienst Gedenkteken plaatsingsvergunning (UPL nr. 142), met grondslag in de Model beheersverordening begraafplaatsen art. 19; zo''n UPL-product blijft, maar wordt niet uitgewerkt in processen, objecten, gebeurtenissen of rollen (regel Wettelijke grondslag).'
