begrip: Verlenen vergunning grafbedekking
vak: bedrijf/gedrag-intern
soort_gedrag: per_keer_doorlopen
onderwerpen:
- lijkbezorging
kenmerken:
  toegewezen_partij:
    waarde: ja
    onderbouwing: Beslisser (college) en Rechthebbende op het graf, die de vergunning aanvraagt (Groningen art. 22 lid 1–2).
    bronnen:
    - 2023-groningen-beheersverordening-gemeentelijke-begraafplaatsen
  aanleiding:
    waarde: ja
