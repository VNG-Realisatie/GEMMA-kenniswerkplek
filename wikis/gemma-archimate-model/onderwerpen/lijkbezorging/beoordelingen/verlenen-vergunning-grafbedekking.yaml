    bronnen:
    - 2023-groningen-beheersverordening-gemeentelijke-begraafplaatsen
definitie: Het beslissen op een aanvraag om een vergunning voor een gedenkteken of andere grafbedekking op een particulier graf.
beschrijving:
- De rechthebbende van een particulier graf vraagt de vergunning aan; het college beslist en kan de vergunning weigeren als niet wordt voldaan aan de nadere regels over de aard en de afmetingen van de grafbedekking (Groningen art. 22; VNG-modelverordening art. 19). Beslisser is het college.
