definitie: Model van de VNG voor de verordening waarin een gemeente het beheer en het gebruik van haar begraafplaatsen regelt.
beschrijving:
- De raad stelt de beheersverordening vast op grond van art. 35 Wet op de lijkbezorging en art. 149 Gemeentewet; het model geeft de begripsbepalingen (particulier en algemeen graf, urnengraf, urnennis, gedenkplaats, rechthebbende, gebruiker, beheerder) en de regels voor uitgifte, termijnen, overschrijving, afstand, grafbedekking, onderhoud en ruiming (aanhef, art. 1–24).
- De openbare versie is die van 2010, met toelichting; nieuwere versies staan in de Kennisbank decentrale regelgeving van SDU. De toelichting citeert art. 28 lid 7 Wet op de lijkbezorging nog met een termijn van twintig jaar; de huidige wet zegt tien jaar (tegenspraak).
taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
besluiten:
- datum: '2026-10-01'
  besluit: Opnemen als beleidskader, met de versie 2010 en de tegenspraak over de termijn in de beschrijving; een actuele versie later opnemen als die openbaar wordt.
  gevolg: opnemen
  redenen:
  - 'grondslag regelgeving: altijd voorleggen'
- datum: '2026-10-08'
  besluit: 'Is grondslag voor alleen bij UPL-producten zonder landelijke wettelijke grondslag (Gedenkteken plaatsingsvergunning, Grafonderhoud). De relaties naar Verlenen grafrecht, Vervallen verklaren grafrecht, Ruimen graf, Graf aanvragen en Grafuitgifte heten ''werkt uit voor'': daar is de Wet op de lijkbezorging de grondslag en regelt de verordening de uitvoering (regel Wettelijke grondslag).'
  gevolg: verwerkt
  stand: 'herzien 2026-10-11: een VNG-modelverordening is nooit grondslag; ook de relaties naar Gedenkteken plaatsingsvergunning en Grafonderhoud heten werkt uit voor; de Model beheersverordening blijft beleidskader (besluit 2026-10-11)'
- datum: '2026-10-11'
  besluit: 'Blijft beleidskader in de groep VNG-modelverordening, als gemeenschappelijke vorm van de gemeentelijke uitwerking: een VNG-modelverordening is een modelverordening van de VNG voor alle gemeenten, een bron zoals de regeling van een gemeente, maar nooit grondslag (regel Bronvoorrang). Het kenmerk is grondslag voor blijft ja en telt de relaties werkt uit voor.'
  gevolg: verwerkt
