    gemma_definitie: Het openhouden van gemeentelijke voorzieningen zoals sportvelden, musea, parkeergarages, wijkcentra en consultatiebureaus en het ter beschikking stellen van de daaraan gerelateerde middelen zoals ruimtes of dranghekken, bijvoorbeeld voor een zelfhulpgroep of een buurtfeest ten behoeve van het versterken van de sociale cohesie. Ook het tegen een vergoeding ter beschikking stellen van ruimte voor bijvoorbeeld de bibliotheek valt hieronder vanwege het maatschappelijke karakter.
