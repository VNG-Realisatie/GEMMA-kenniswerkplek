taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen element voor dit begrip; nieuw voor GEMMA.
definitie: Het onderhouden van grafbedekking en beplanting op een graf door de gemeente.
beschrijving:
- De gemeente maakt gedenktekens schoon en onderhoudt de beplanting op graven, op sommige begraafplaatsen altijd en elders op schriftelijk verzoek van de rechthebbende voor ten minste vijf jaar, tegen betaling van een recht uit de heffingsverordening (Groningen art. 23, 24 lid 3). Bij niet-betalen wordt de grafbedekking na waarschuwing verwijderd (art. 23 lid 4). De VNG-modelverordening regelt een minimaal onderhoud door de gemeente (art. 20).
relaties:
- soort: toegang (registreren)
  naar: heffing
  naam: leidt tot (recht voor onderhoud)
  ggm_match: geen
  bronnen:
  - 2023-groningen-beheersverordening-gemeentelijke-begraafplaatsen
  - 2026-vng-retributies
  vindplaats: Groningen art. 23 lid 2; § Lijkbezorgingsrechten
- soort: realisatie
