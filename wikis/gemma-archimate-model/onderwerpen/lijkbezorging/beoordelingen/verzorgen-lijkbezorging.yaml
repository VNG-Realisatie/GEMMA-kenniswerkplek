  besluit: De functie wordt de taak Verzorgen lijkbezorging, een procescluster boven Bezorgen lijken, Beheren grafrechten en Beheren graven. De partiële GEMMA-match met Exploiteren van begraafplaatsen vervalt; die GEMMA-functie wordt een eigen element dat de processen bedient.
  gevolg: verwerkt
- datum: '2026-10-05'
  besluit: 'Stoffelijk overschot in lopende tekst: in definitie en beschrijving, met het kernobject Stoffelijk overschot.'
  gevolg: verwerkt
- datum: '2026-10-08'
  besluit: 'Vervalt: de taak is geen procesniveau meer (besluit 2026-10-08, procesniveaus volgens GEMMA Online, Proceshiërarchie). Boven de levensloopprocessen staat het beleidsdomein Begraafplaatsen en crematoria; de beschrijving staat letterlijk, zonder de zin over de taak als groepering, in het register van beleidsdomeinen. Het object in Archi vervalt; een typewijziging naar groepering kan niet (regel Objectbehoud).'
  gevolg: afwijzen
