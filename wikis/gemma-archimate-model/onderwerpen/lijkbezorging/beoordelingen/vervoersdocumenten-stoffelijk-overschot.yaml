begrip: Vervoersdocumenten stoffelijk overschot
vak: bedrijf/gedrag-extern
homoniemen:
- begrip: Laissez-passer voor lijken
  betekenis: Het document van de burgemeester waarmee een stoffelijk overschot ongehinderd naar een verdragsstaat van de Overeenkomst van Straatsburg wordt vervoerd (Besluit op de lijkbezorging art. 11 lid 1)
  waar: Specialisatie van Vergunning zonder eigen pagina in deze wiki
  naamkeuze: 'Deze pagina heet Vervoersdocumenten stoffelijk overschot: de dienst, met de UPL-naam, en Laissez-passer voor lijken als synoniem (wet). Het document zelf is de specialisatie Laissez-passer voor lijken van Vergunning en krijgt geen pagina; het afgeven is het bedrijfsproces Afgeven laissez-passer.'
onderwerpen:
- lijkbezorging
kenmerken:
  gerealiseerd_door:
    waarde: ja
    naar:
    - afgeven-laissez-passer
definitie: Het document van de gemeente waarmee een stoffelijk overschot ongehinderd naar het buitenland wordt vervoerd.
beschrijving:
- Vervoer naar een staat die partij is bij de Overeenkomst van Straatsburg gaat ongehinderd met een laissez-passer voor lijken van de burgemeester van de gemeente waar de akte van overlijden is ingeschreven (Besluit op de lijkbezorging art. 11 lid 1). Voor vervoer over land naar België of Luxemburg volstaat het verlof tot begraving of crematie (art. 11 lid 3). Bij binnenkomst wordt het document aan de douane overgelegd (art. 11 lid 5).
