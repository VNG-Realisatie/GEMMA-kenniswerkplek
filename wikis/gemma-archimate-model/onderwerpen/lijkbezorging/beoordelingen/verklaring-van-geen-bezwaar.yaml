taakveld: 7 Volksgezondheid en Milieu
beleidsdomein: Begraafplaatsen en crematoria
definitie: Verklaring van de officier van justitie dat hij geen bezwaar heeft tegen begraving of crematie.
beschrijving:
- Bij een niet-natuurlijke dood geeft de officier van justitie een verklaring van geen bezwaar af; die vervangt de verklaring van overlijden als grond voor het verlof tot begraving of crematie (art. 12). Ook voor het vervroegen van een uitvaart is zo'n verklaring nodig (Ondernemersplein). De afweging van de officier zelf valt buiten dit model; de verklaring is invoer voor de gemeente.
