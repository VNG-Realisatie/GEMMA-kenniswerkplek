gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen element voor dit begrip; nieuw voor GEMMA.
definitie: Het verlenen van een grafrecht op een particulier graf aan een rechthebbende.
beschrijving:
- Het college verleent op schriftelijke aanvraag een recht op een particulier graf, voor 30 jaar of bij een urnengraf voor 5 tot 30 jaar (Groningen art. 16; VNG-modelverordening art. 15); de wet spreekt van het vestigen van het uitsluitend recht, voor onbepaalde tijd of ten minste tien jaar (art. 28). Beslisser is het college; de VNG-modelverordening beveelt mandaat aan de beheerder aan. Graven worden in volgorde van ligging uitgegeven (Groningen art. 14). Verlenging volgt op verzoek van de rechthebbende (art. 28 lid 1). De gemeente heft voor de uitgifte lijkbezorgingsrechten (VNG retributies).
