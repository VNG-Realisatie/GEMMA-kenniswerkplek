definitie: Het uitvoeren van activiteiten om producten en diensten te leveren binnen het Veiligheidsdomein.
beschrijving:
- De gemeente levert producten en diensten in het domein Openbare orde en veiligheid, zoals vergunningen voor evenementen en horeca.
per_onderwerp:
  lijkbezorging:
  - 'De UPL rekent asverstrooiing tot het domein Openbare orde en veiligheid: de ontheffing is een APV-besluit (UPL; APV Groningen art. 5:27 lid 3).'
domein: Openbare orde en veiligheid
gemma:
  id: id-11ceda47-d0a4-49cb-88d7-eaf623172f3f
  sterkte: exact
  onderbouwing: 'Zelfde begrip en zelfde definitie: de GEMMA-bedrijfsfunctie Producten- en dienstenrealisatie veiligheidsdomein.'
relaties: []
toelichting: 'Vervalt in de wiki: de functie omvatte alleen de dienst Asverstrooiing, die geen landelijke wettelijke grondslag heeft en geen proces heeft om te bedienen (regel Wettelijke grondslag); Asverstrooiing staat nu onder Exploiteren van begraafplaatsen. Het GEMMA-element blijft; GEMMA-terugmelding 1.'
besluiten:
- datum: '2026-10-08'
  besluit: 'Vervallen in de wiki: ze omvatten alleen Asverstrooiing, die geen landelijke grondslag en geen proces heeft; Asverstrooiing gaat naar Exploiteren van begraafplaatsen. De regel Wettelijke grondslag over bedrijfsfuncties blijft, met een aanvulling. De GEMMA-elementen blijven; voorstel in GEMMA-terugmelding 1, in een nieuw register van GEMMA-terugmeldingen met de opbouw van de GGM- en procesarchitectuur-terugmeldingen.'
  gevolg: verwerkt
  stand: geldt; GEMMA-terugmelding 1
- datum: '2026-10-08'
  besluit: 'Vervalt in de wiki (regel Wettelijke grondslag): na het vervallen van Verlenen toestemming asverstrooiing bedient de functie geen proces meer, en Asverstrooiing gaat naar Exploiteren van begraafplaatsen. Het GEMMA-element blijft in GEMMA (de sync haalt alleen de wiki-eigenschappen weg); het voorstel aan het GEMMA-team staat in GEMMA-terugmelding 1.'
  gevolg: afwijzen
status: afgewezen
