    onderbouwing: Het leveren van producten en diensten aan klanten is in GEMMA de functie Uitvoering, per domein uitgewerkt (Bedrijfsfuncties, regel 24 en 346). Het domein Openbare orde en veiligheid omvat alle taken betreffende de bestuurlijke handhaving in de veiligheidsketen (Bedrijfsarchitectuur openbare orde en veiligheid, regel 20). GEMMA-bedrijfsfunctie onder Uitvoering openbare orde en veiligheid.
