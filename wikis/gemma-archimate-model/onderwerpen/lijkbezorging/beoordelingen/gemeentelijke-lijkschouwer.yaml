- datum: '2026-10-10'
  besluit: 'De waarschuwing van de gemeentelijke lijkschouwer aan de ambtenaar van de burgerlijke stand bij een niet-natuurlijke dood (Wlb art. 10 lid 1) is geen relatie tussen de rollen, maar hoort bij de stroom van Schouwen stoffelijk overschot naar Verlenen verlof tot begraving of crematie: geeft de verklaring van overlijden door aan, of waarschuwt bij een niet-natuurlijke dood (kennismodel: een handeling tussen rollen loopt via een proces, stroom of gebeurtenis).'
  gevolg: verwerkt
