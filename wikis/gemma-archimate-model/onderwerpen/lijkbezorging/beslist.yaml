    gemma_naam: Behandelen melding
    gemma_type: business-process
    gemma_definitie: 'Het in ontvangst nemen en afhandelen van een medeling en het resultaat hiervan terugkoppelen naar de melder. Bij een melding meldt men klant iets aan de gemeente en verwacht men dat de gemeente daar actie op onderneemt. Voorbeelden zijn een melding openbare ruimte, een melding omtrent overbewoning of een melding met betrekking tot het niet naleven van de leerplichtwet. Dit zijn andersoortige meldingen dan die bedoeld onder behandelen aangiften en meldingen om twee redenen: deze meldingen hebben betrekking op een al dan niet door de gemeente geleverde dienst (bv. beheren openbare ruimte) en het palet aan acties/antwoorden is diverser dan bij aangiften en meldingen, waar het vrijwel altijd het bijwerken van een registratie is.'
