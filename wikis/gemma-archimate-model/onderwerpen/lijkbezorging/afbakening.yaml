besluiten:
- datum: '2026-10-04'
  besluit: 'Beleidsdomein Begraafplaatsen en crematoria: Voorstel aan GEMMA en GGM: een beleidsdomein *Begraafplaatsen en crematoria* onder taakveld 7 (Iv3 7.5). De export maakt de groepering in de wiki-map voor de objecten, producten en beleidskaders van lijkbezorging. Gemeentebegrafenis blijft daarnaast in het GGM-beleidsdomein Gemeentebegrafenissen.'
  stand: geldt; procesarchitectuur-terugmelding 1
- datum: '2026-10-04'
  besluit: 'Indelingsvelden: Doelgroep, domein, afnemer en regelgever zoals voorgesteld: onder meer de houder-rollen en de gemeentelijke lijkschouwer *gemeente*, Kerkgenootschap en Adviseur *ketenpartners*, Uitvaartondernemer *inwoners en ondernemers*, Uitvaart vervroegen of uitstellen *Publieksdiensten*, alle processen en diensten *extern*.'
- datum: '2026-10-05'
  besluit: 'UPL-producten van lijkbezorging: Toets per UPL-product volgens de GEMMA-definities: een product als het een dienst met een afspraak bundelt (Grafuitgifte: Graf aanvragen en Grafrecht), anders een dienst die een deelproces realiseert. Het tarief grafrechten is een specialisatie van Heffing; overlijdensaangifte, overlijdensakte en doodgeboren kind aangifte horen bij het onderwerp burgerlijke stand. Nieuw: product Grafuitgifte, zeven diensten en vier deelprocessen (Verlenen vergunning grafbedekking, Verlenen toestemming asverstrooiing, Verlenen verlof tot ontleding, Afgeven laissez-passer).'
  stand: 'herzien 2026-10-11 voor Grafuitgifte: een UPL-item is altijd een dienst; Graf aanvragen gaat op in de dienst Grafuitgifte en er is geen product meer'
- datum: '2026-10-05'
  besluit: 'Stoffelijk overschot in lopende tekst: Per element beoordeeld (19 elementen): in definitie, beschrijving en tekst per onderwerp wordt lijk stoffelijk overschot, ook waar een zin de inhoud van een register beschrijft (Graf, Houder van het crematorium). Blijven staan: de wetsterm waar het over het begrip zelf gaat (Wet op de lijkbezorging: "bepaalt wat een lijk is"), de vaste termen lijkbezorging, lijkschouwing, lijkschouwer en laissez-passer voor lijken, het begrip Register van begraven lijken en synoniemen met context wet. Maatregel bij besmet lijk (specialisatie van Beschikking, geen pagina) heet Maatregel bij besmet stoffelijk overschot.'
- datum: '2026-10-08'
  begrip: Producten- en dienstenrealisatie veiligheidsdomein
  besluit: 'Vervallen in de wiki: ze omvatten alleen Asverstrooiing, die geen landelijke grondslag en geen proces heeft; Asverstrooiing gaat naar Exploiteren van begraafplaatsen. De regel Wettelijke grondslag over bedrijfsfuncties blijft, met een aanvulling. De GEMMA-elementen blijven; voorstel in GEMMA-terugmelding 1, in een nieuw register van GEMMA-terugmeldingen met de opbouw van de GGM- en procesarchitectuur-terugmeldingen.'
  stand: geldt; GEMMA-terugmelding 1
- datum: '2026-10-08'
  begrip: Producten- en dienstenrealisatie veiligheidsdomein
  besluit: 'Vervalt in de wiki (regel Wettelijke grondslag): na het vervallen van Verlenen toestemming asverstrooiing bedient de functie geen proces meer, en Asverstrooiing gaat naar Exploiteren van begraafplaatsen. Het GEMMA-element blijft in GEMMA (de sync haalt alleen de wiki-eigenschappen weg); het voorstel aan het GEMMA-team staat in GEMMA-terugmelding 1.'
- datum: '2026-10-08'
  begrip: Uitvoering openbare orde en veiligheid
  besluit: 'Vervallen in de wiki: ze omvatten alleen Asverstrooiing, die geen landelijke grondslag en geen proces heeft; Asverstrooiing gaat naar Exploiteren van begraafplaatsen. De regel Wettelijke grondslag over bedrijfsfuncties blijft, met een aanvulling. De GEMMA-elementen blijven; voorstel in GEMMA-terugmelding 1, in een nieuw register van GEMMA-terugmeldingen met de opbouw van de GGM- en procesarchitectuur-terugmeldingen.'
  stand: geldt; GEMMA-terugmelding 1
- datum: '2026-10-08'
  begrip: Uitvoering openbare orde en veiligheid
  besluit: 'Vervalt in de wiki: omvat niets meer na het vervallen van Producten- en dienstenrealisatie veiligheidsdomein. Het GEMMA-element blijft in GEMMA; GEMMA-terugmelding 1.'
- datum: '2026-10-11'
  besluit: 'Functies en diensten van Lijkbezorging: van de functies blijven Exploiteren van begraafplaatsen en Vergunningenbeheer Publieksdiensten, de bladfuncties die een proces van het onderwerp bedienen; Uitvoering fysieke leefomgeving, Exploitatie fysieke leefomgeving, Producten- en dienstenrealisatie fysieke leefomgeving, Uitvoering Publieksdiensten, Producten- en dienstenrealisatie veiligheidsdomein en Uitvoering openbare orde en veiligheid zijn knopen van de functiehiërarchie, zonder beoordeling. Verlenen verlof tot ontleding en Afgeven laissez-passer worden door geen functie bediend. Er is geen product meer: Grafuitgifte is een dienst. Asverstrooiing, Gedenkteken plaatsingsvergunning en Grafonderhoud zijn diensten zonder grondslag: een VNG-model is nooit grondslag, de relaties van de Model-APV en de Model beheersverordening heten werkt uit voor.'
