naam: Lijkbezorging
niveau: eigen
status: in-behandeling
omschrijving:
- 'Wat de gemeente ziet, doet en beslist rond de lijkbezorging: lijkschouw door de gemeentelijke lijkschouwer, de verklaring van overlijden, verlof tot begraven of cremeren, de gemeentelijke begraafplaats met graven en grafrechten, bijzetting van asbussen en urnen, ruiming, en de lijkbezorgingsrechten die de gemeente heft voor het gebruik van begraafplaats of crematorium. Van de VNG-pagina over retributies is alleen de paragraaf over lijkbezorgingsrechten in scope. De beheersverordening van Groningen (met de begripsbepalingen van het VNG-model) levert de gangbare taal van de gemeentelijke begraafplaats. Van de externe UPL-lijst horen 16 producten bij dit onderwerp: de producten over begraafplaats, crematorium, asbestemming, vervoer en verlof, en de aangifte van een doodgeboren kind; de geboorteakte van een levenloos kind en de overlijdensuitkering niet (besluit 2026-10-04). Van de APV van Groningen is alleen de afdeling Verstrooiing van as in scope, in plaats van de VNG-model-APV, die niet openbaar is (besluit 2026-10-04).'
