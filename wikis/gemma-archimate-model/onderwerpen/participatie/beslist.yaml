  kwaliteitsdoelen:
  - gemma_id: id-d78c3f24-70bd-11e4-67ab-0050568a6200
    gemma_naam: Transparant
    gemma_definitie: Burgers en bedrijven kunnen gemakkelijk te weten komen hoe de overheid werkt en krijgen inzicht waarom ze voor bepaalde dienstverlening wel of niet in aanmerking komen. De overheid houdt hen op de hoogte van het verloop van procedures waarbij ze betrokken zijn. De overheid zorgt ervoor dat haar werkwijze transparant is, kan zich hierover verantwoorden en stelt de informatie die hiervoor nodig is actief beschikbaar. Burgers en bedrijven kunnen de prestaties van overheden vergelijken, controleren en beoordelen. De overheid stelt de informatie die daarvoor nodig is actief beschikbaar. Dit is belangrijk voor het vertrouwen van burgers en bedrijven in de overheid.
  - gemma_id: id-d78c3f24-70bd-11e4-67ab-0050568a6202
    gemma_naam: Ontvankelijk
    gemma_definitie: Burgers en bedrijven kunnen gemakkelijk terecht bij de dienstverlener met verzoeken, ideeën voor verbetering, meldingen of klachten. De overheidsdienstverlener herstelt met deze inbreng fouten, compenseert tekortkomingen en leert hiervan om haar dienstverlening continu te verbeteren. Bij innovaties en het vernieuwen van diensten is het belangrijk om alle belanghebbenden in beeld te hebben en te betrekken. Bij inzet van nieuwe technologieën wordt rekening gehouden met de waarden, belangen, verwachtingen en zorgen van burgers en bedrijven.
  pad: elementpaginas/motivatie/beleidskaders/gemeentelijke-regelgeving/model-participatieverordening.md
