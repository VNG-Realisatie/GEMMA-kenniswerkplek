definitie: Openbaar verslag waarin een bestuursorgaan na afloop van inwonersparticipatie het proces, de uitkomsten, zijn reactie daarop en een evaluatie vastlegt.
beschrijving:
- Nadat inwonersparticipatie heeft plaatsgevonden stelt het bestuursorgaan het eindverslag op en maakt het openbaar; heeft het college het plan opgesteld, dan stelt het ook het eindverslag op en informeert het de raad over de inhoud (2024-vng-model-participatieverordening, var. 1 art. 5 lid 1, 3; var. 2 art. [10] lid 1, 3).
- Het verslag bevat in elk geval een beschrijving van het gevolgde proces, de uitkomsten en de argumenten die naar voren zijn gebracht, een onderbouwde reactie daarop met hoe het beleid is aangepast, en een evaluatie van het proces (2024-vng-model-participatieverordening, var. 1 art. 5 lid 2; var. 2 art. [10] lid 2).
- Het verslag geeft ook inwoners die niet hebben deelgenomen inzicht in het proces, en kan verbeterpunten aanwijzen, ook voor de participatieverordening (2024-vng-implementatiehandleiding-model-participatieverordening, art. 5). De wet schrijft het verslag niet voor; de raad regelt in de participatieverordening hoe inwoners worden betrokken (2026-rijk-gemeentewet-wettekst, art. 150 lid 1).
