synoniemen:
- naam: Verzoek toepassing uitdaagrecht
  context: beleid, variant 1
- naam: Verzoek om overheidsparticipatie
  context: beleid, variant 2
- naam: Overheidsparticipatieverzoek
  context: beleid, toelichting variant 2
definitie: Verzoek van inwoners of maatschappelijke partijen aan het college om een gemeentelijke taak over te nemen of de gemeente bij hun initiatief te betrekken.
beschrijving:
- Het verzoek wordt altijd bij het college ingediend en bevat een omschrijving van de taak of van de gewenste overheidsparticipatie, de reden en het beoogde resultaat. De gemeente kan meer vragen (de betrokkenheid, kennis en ervaring van de indiener, de kosten of middelen, en hoe de indiener de kwaliteit en de uitvoering van de taak waarborgt) en een formulier vaststellen (2024-vng-model-participatieverordening, var. 1 art. 6; var. 2 art. [11]).
- Het bevoegde bestuursorgaan wijst het verzoek toe of af en maakt de reactie met de onderbouwing openbaar; bij toewijzing volgen afspraken over de uitvoering (2024-vng-model-participatieverordening, var. 1 art. [8], [9]; var. 2 art. [13], [14]).
- 'In variant 1 van de VNG-modelverordening is het een verzoek om toepassing van het uitdaagrecht: het recht van inwoners en maatschappelijke partijen om de feitelijke uitvoering van een gemeentelijke taak over te nemen (2026-rijk-gemeentewet-wettekst, art. 150 lid 3; 2024-vng-model-participatieverordening, var. 1 art. 1, 6). In variant 2 is het een verzoek om overheidsparticipatie en is het breder: het vraagt de gemeente te betrekken bij de voorbereiding, uitvoering of evaluatie van beleid, met het uitdaagrecht als onderdeel (2024-vng-model-participatieverordening, var. 2 art. 1, [11]).'
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Participatie
ggm:
  sterkte: geen
  onderbouwing: Het GGM kent geen entiteit voor dit verzoek; Verzoek (Omgevingswet) is een vraag aan het bevoegd gezag om een product of dienst te leveren, een ander begrip. Het verzoek ontstaat in Behandelen verzoek uitdaagrecht (2024-vng-model-participatieverordening, var. 1 art. 6).
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen object voor dit verzoek; Verzoek (Omgevingswet) is een vraag aan het bevoegd gezag om een product of dienst te leveren. Nieuw voor GEMMA.
besluiten:
- datum: '2026-10-15'
  besluit: 'Geen specialisatie van Aanvraag, en Indiener geen specialisatie van Belanghebbende: geen bron noemt de reactie op het verzoek een besluit, en art. 150 lid 3 Gemeentewet vraagt geen rechtstreeks belang. Opnieuw toetsen als rechtspraak of een handreiking de reactie als besluit kwalificeert.'
  gevolg: verwerkt
  zekerheid: logica
