definitie: Persoon die ingezetene is van de gemeente.
beschrijving:
- De Model Participatieverordening definieert inwoners als ingezetenen als bedoeld in artikel 2 van de Gemeentewet; een gemeente kan daar ondernemers aan toevoegen (2024-vng-model-participatieverordening, var. 1 art. 1). De wet spreekt van ingezetenen (2026-rijk-gemeentewet-wettekst, art. 150).
- De gegevens van de ingezetene staan in het bedrijfsobject Ingeschreven persoon, met de specialisatie Ingezetene.
per_onderwerp:
  participatie:
  - De gemeente betrekt inwoners bij de voorbereiding, uitvoering en evaluatie van haar beleid, en inwoners kunnen bij het college een verzoek indienen om de feitelijke uitvoering van een gemeentelijke taak over te nemen, het uitdaagrecht (2026-rijk-gemeentewet-wettekst, art. 150 lid 1 en 3; 2024-vng-model-participatieverordening, var. 1 art. 6 lid 1).
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent de actor Burger (procesarchitectuur, Actoren en rollen) zonder definitie en zonder relaties; een burger is niet altijd ingezetene van de gemeente, dus geen match op betekenis. Ingezetene (RSGB) is een bedrijfsobject, de registratie van de persoon, geen partij. Nieuw voor GEMMA.
