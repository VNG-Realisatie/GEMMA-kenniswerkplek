definitie: Afspraken die het bestuursorgaan bij toewijzing van een verzoek uitdaagrecht met de indiener maakt over de uitvoering.
beschrijving:
- Wijst het bevoegde bestuursorgaan een verzoek toe, dan maakt het met de indiener afspraken over het proces, het resultaat en de looptijd, het budget en de financieringswijze, het contact met en de ondersteuning door het bestuursorgaan, de stappen bij het niet nakomen van de afspraken en het tussentijds beëindigen, en de evaluatie (2024-vng-model-participatieverordening, var. 1 art. [9]; var. 2 art. [14]). Variant 1 laat de onderwerpen facultatief, variant 2 noemt ze vast.
- Volgens de toelichting ligt het voor de hand de afspraken vast te leggen in een overeenkomst (2024-vng-model-participatieverordening, toelichting bij var. 1 art. [9] en var. 2 art. [14]).
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Participatie
ggm:
  sterkte: geen
  onderbouwing: Het GGM kent geen entiteit voor afspraken over de uitvoering van een gemeentelijke taak door inwoners of maatschappelijke partijen. Contract (Inkoop, bindende overeenkomst) is verwant maar breder, in een beleidsdomein van de interne organisatie met leveranciers als wederpartij. De afspraak ontstaat in Behandelen verzoek uitdaagrecht (2024-vng-model-participatieverordening, var. 1 art. [9]).
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen afspraak voor dit begrip; Contract (uit het GGM, Inkoop) is een bindende overeenkomst in de inkoop. Nieuw voor GEMMA.
