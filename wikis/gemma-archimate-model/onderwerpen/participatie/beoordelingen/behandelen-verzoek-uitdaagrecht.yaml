    bronnen:
    - 2024-vng-model-participatieverordening
  eigen_normering:
    waarde: ja
    onderbouwing: De verordening van de raad bepaalt de voorwaarden waaronder ingezetenen en maatschappelijke partijen gemeentelijke taken kunnen uitvoeren (Gemeentewet art. 150 lid 3). De VNG-modelverordening regelt de indieningsvereisten, de afwijzingsgronden, een reactietermijn (voorbeeldwaarde vier weken, eenmaal te verdagen) en de openbaarmaking (var. 1 art. 6, [8]; var. 2 art. [11], [13]).
    bronnen:
    - 2026-rijk-gemeentewet-wettekst
    - 2024-vng-model-participatieverordening
  bijdrage_aan_groter_proces:
    waarde: nee
    onderbouwing: Een eigen levensloopproces met kernobject Verzoek uitdaagrecht; geen deel van een groter proces.
  klant_tot_klant:
    waarde: nee
    onderbouwing: 'Niet van toepassing: levensloopproces.'
  omvat_levensloop:
    waarde: ja
    onderbouwing: 'Omvat de levensloop van het Verzoek uitdaagrecht: indienen bij het college, eventueel aanvullen, doorzenden aan het bevoegde bestuursorgaan, toewijzen of afwijzen, en bij toewijzing de afspraken over de uitvoering en de evaluatie (var. 1 art. 6 lid 5, [8], [9]; var. 2 art. [11], [13], [14]).'
    bronnen:
    - 2024-vng-model-participatieverordening
  eigen_besluit:
    waarde: ja
    onderbouwing: Eindigt in de reactie van het bevoegde bestuursorgaan (raad, college of burgemeester), dat het verzoek toewijst of afwijst op verplichte of facultatieve gronden (var. 1 art. [8] lid 1, 3–6; var. 2 art. [13]). Of die reactie een besluit in de zin van de Awb is, zeggen de bronnen niet (vraag bij Verzoek uitdaagrecht).
    bronnen:
    - 2024-vng-model-participatieverordening
  levert_aanbod:
    waarde: nee
    onderbouwing: De UPL kent geen product of dienst voor het uitdaagrecht of de overheidsparticipatie; het burgerinitiatief (UPL nr. 96) is een ander begrip, met de Grondwet art. 5 en de APV als grondslag.
  leidt_tot_gebeurtenis:
    waarde: nee
    onderbouwing: De bronnen noemen geen toestandsverandering met een eigen naam die een ander proces start.
