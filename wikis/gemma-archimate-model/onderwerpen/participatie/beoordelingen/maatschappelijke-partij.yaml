definitie: Vereniging, stichting, buurtcomité of andere organisatie die een actieve bijdrage levert aan de samenleving in de gemeente.
beschrijving:
- De wet noemt maatschappelijke partijen naast ingezetenen bij het uitvoeren van gemeentelijke taken, maar definieert het begrip niet; de gemeente bakent de groep af in haar verordening (2026-rijk-gemeentewet-wettekst, art. 150 lid 3; 2024-vng-implementatiehandleiding-model-participatieverordening, var. 1 art. 1).
- De Model Participatieverordening legt de nadruk op lokale binding; facultatief vallen ook sociale ondernemingen, ondernemingen zonder winstoogmerk of ondernemingen die geen winst uitkeren eronder, of alleen organisaties die een collectief vormen (2024-vng-model-participatieverordening, var. 1 art. 1 en toelichting).
per_onderwerp:
  participatie:
  - Maatschappelijke partijen kunnen bij het college een verzoek om toepassing van het uitdaagrecht indienen, in variant 2 een verzoek om overheidsparticipatie, en zo de feitelijke uitvoering van een gemeentelijke taak overnemen (2024-vng-model-participatieverordening, var. 1 art. 6 lid 1, var. 2 art. [11] lid 1).
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen actor voor maatschappelijke organisaties; MaatschappelijkeActiviteit (RSGB) is een ander begrip, de activiteit van een onderneming of rechtspersoon in het Handelsregister. Nieuw voor GEMMA.
