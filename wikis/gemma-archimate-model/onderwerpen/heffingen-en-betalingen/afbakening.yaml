naam: Heffingen en betalingen
niveau: thematisch
status: in-behandeling
omschrijving:
- 'De heffingen die de gemeente oplegt, zoals rechten en leges, en de verordeningen die ze regelen: Heffing en Heffingsverordening. Nog te beoordelen: het heffen zelf, dat de verordening raadpleegt voor de tarieven, en de VNG Modelverordening lijkbezorgingsrechten.'
bronnen: []
besluiten:
- datum: '2026-10-12'
  begrip: Belastingaanslag bezwaar
  besluit: 'Thuis in Heffingen en betalingen, bij het kernobject Belastingaanslag (UPL nr. 49, grondslag Awb art. 7:1; Gemeentewet art. 231: de heffing van gemeentelijke belastingen volgt de Algemene wet inzake rijksbelastingen, met de heffingsambtenaar in de plaats van de inspecteur). Beoordelen als dat onderwerp wordt uitgewerkt, met de AWR en de Gemeentewet als bronnen, als specialisatie van de dienst Bezwaar, gerealiseerd door Behandelen bezwaar.'
