- naam: Onderzoeken klacht
  omschrijving: Iemand die niet bij de gedraging betrokken was, onderzoekt de klacht en hoort de klager en degene over wie geklaagd wordt, met een verslag; eventueel adviseert een klachtadviescommissie (art. 9:7, 9:9, 9:10, afdeling 9.1.3).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
- naam: Afhandelen klacht
  omschrijving: Het bestuursorgaan meldt de klager schriftelijk en gemotiveerd de bevindingen, het oordeel en de conclusies, met de ombudsman; de klacht komt in het jaarlijkse overzicht (art. 9:11, 9:12, 9:12a).
  bronnen:
