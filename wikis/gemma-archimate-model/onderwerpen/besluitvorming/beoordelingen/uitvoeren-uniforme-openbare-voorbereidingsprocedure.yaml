kernobject: besluit
afnemer: extern
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Besluitvorming
definitie: Het voorbereiden van een besluit door het ontwerp ter inzage te leggen, belanghebbenden hun zienswijze te laten geven en daarna te besluiten.
beschrijving:
- De uniforme openbare voorbereidingsprocedure (Awb afdeling 3.4) geldt voor de voorbereiding van een besluit als een wettelijk voorschrift of het bestuursorgaan dat bepaalt (art. 3:10). Het bestuursorgaan legt het ontwerp met de stukken ter inzage, maakt dat vooraf bekend en zendt het toe aan de aanvrager en de belanghebbenden tot wie het besluit zal zijn gericht (art. 3:11–3:13). Belanghebbenden, en als dat is bepaald ook anderen, brengen binnen zes weken schriftelijk of mondeling hun zienswijze naar voren; van mondelinge zienswijzen wordt een verslag gemaakt (art. 3:15–3:17). Een besluit op aanvraag volgt uiterlijk zes maanden na ontvangst van de aanvraag (art. 3:18).
- Inspraak over gemeentelijk beleid verloopt via deze procedure, tenzij de verordening van de raad anders bepaalt (Gemeentewet art. 150 lid 2).
synoniemen:
- naam: Uniforme openbare voorbereidingsprocedure
  context: wet
gemma:
  sterkte: geen
  onderbouwing: GEMMA kent de Uniforme openbare voorbereidingsprocedure als dienst in de procesbouwstenen (id-f321df1c-c7dd-4d11-b42b-534a37a53d9e), zonder definitie of relaties; dat is een ander elementtype. Het Generiek deelproces Uitvoeren inspraakprocedure (Vaststellen omgevingsplan) is beperkt tot het omgevingsplan. Nieuw voor GEMMA.
deelprocessen:
- naam: Ter inzage leggen ontwerp
  omschrijving: Het bestuursorgaan legt het ontwerp van het besluit met de stukken ter inzage, geeft daar vooraf kennis van in het publicatieblad en zendt het toe aan de aanvrager en de belanghebbenden tot wie het besluit zal zijn gericht (art. 3:11–3:13).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
- naam: Ontvangen zienswijzen
  omschrijving: Belanghebbenden brengen binnen zes weken schriftelijk of mondeling hun zienswijze naar voren; van mondelinge zienswijzen wordt een verslag gemaakt; de aanvrager kan zo nodig reageren (art. 3:15–3:17).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
- naam: Nemen besluit
  omschrijving: Het bestuursorgaan neemt het besluit, bij een besluit op aanvraag uiterlijk zes maanden na ontvangst van de aanvraag; zijn er geen zienswijzen, dan meldt het dat en besluit het binnen vier weken (art. 3:18).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
