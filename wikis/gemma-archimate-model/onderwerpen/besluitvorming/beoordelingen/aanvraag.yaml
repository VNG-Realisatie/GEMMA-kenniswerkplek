- burgerzaken
kenmerken:
  onderscheidbare_exemplaren:
    waarde: ja
    onderbouwing: Elke aanvraag heeft een aanvrager, een dagtekening en een gevraagde beschikking (art. 4:2 lid 1).
    bronnen:
    - 2026-rijk-algemene-wet-bestuursrecht-wettekst
  levenscyclus:
    waarde: ja
    onderbouwing: Wordt ingediend, eventueel aangevuld, en eindigt in een besluit of in het niet behandelen ervan (art. 4:1, 4:5, 4:13).
    bronnen:
    - 2026-rijk-algemene-wet-bestuursrecht-wettekst
  wordt_bewerkt:
    waarde: ja
    naar:
    - behandelen-aanvraag-beschikking
    - behandelen-aanvraag-nadeelcompensatie
    - uitvoeren-uniforme-openbare-voorbereidingsprocedure
    - vaststellen-dwangsom-bij-niet-tijdig-beslissen
  afspraak:
    waarde: nee
    onderbouwing: Geen overeenkomst tussen partijen.
  waarneembare_vorm:
    waarde: nee
    onderbouwing: Het verzoek zelf, niet de vorm; het formulier is de vorm (art. 4:4).
  deel_van_object:
    waarde: nee
    onderbouwing: Geen onderdeel van een ander object; de aanvraag gaat aan het besluit vooraf.
  invoer_van_een_ander:
    waarde: nee
    onderbouwing: De aanvrager dient haar in, maar de gemeente behandelt en bewaart haar als eigen zaak (art. 4:1, 4:5).
  geautomatiseerd_verwerkt:
    waarde: nee
    onderbouwing: De bronnen noemen geen geautomatiseerde verwerking als gegevensstructuur.
  generiek:
    waarde: ja
    onderbouwing: Komt met dezelfde betekenis voor in elk onderwerp waarin de gemeente op verzoek beslist (art. 1:3 lid 3).
    bronnen:
    - 2026-rijk-algemene-wet-bestuursrecht-wettekst
homoniem_van: Aanvraag (GGM, ICT)
definitie: Verzoek van een belanghebbende aan een bestuursorgaan om een besluit te nemen.
beschrijving:
- Een aanvraag is een verzoek van een belanghebbende om een besluit te nemen (Awb art. 1:3 lid 3). Een aanvraag om een beschikking wordt schriftelijk ingediend bij het bevoegde bestuursorgaan, is ondertekend en bevat ten minste naam en adres van de aanvrager, de dagtekening en de gevraagde beschikking, met de gegevens en bescheiden die voor de beslissing nodig zijn (art. 4:1, 4:2). Het bestuursorgaan kan er een formulier voor vaststellen (art. 4:4) en kan een onvolledige aanvraag buiten behandeling laten (art. 4:5). De beschikking volgt binnen de wettelijke termijn, of anders binnen een redelijke termijn van ten hoogste acht weken (art. 4:13).
per_onderwerp:
  burgerzaken:
  - De aanvraag van een reisdocument, rijbewijs of verklaring omtrent het gedrag start het bijbehorende bedrijfsproces; ze is daar een onderdeel van het proces, zonder eigen pagina (Paspoortwet art. 1 onder a).
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Besluitvorming
