  onderbouwing: Zelfde begrip; de GGM-definitie (verzoek aan een bevoegde macht) is algemener dan de Awb, die het verzoek aan een besluit koppelt. Diensten is een duplicaat met een smallere definitie; Aanvraag in ICT is een interne aanvraag en een homoniem.
