afnemer: extern
domein: Bestuur
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Besluitvorming
definitie: Het indienen van een klacht over de manier waarop een bestuursorgaan of een medewerker zich heeft gedragen.
beschrijving:
- 'Ieder heeft het recht een klacht in te dienen bij een bestuursorgaan over de manier waarop het zich jegens hem of een ander heeft gedragen; de gedraging van een medewerker geldt als gedraging van het bestuursorgaan (Awb art. 9:1). Het bestuursorgaan behandelt mondelinge en schriftelijke klachten behoorlijk (art. 9:2); voor een schriftelijke klacht gelden vaste regels: ontvangstbevestiging, horen, afhandeling binnen zes weken en een gemotiveerd oordeel, waarna de klager zich tot de ombudsman kan wenden (art. 9:4–9:12). Tegen het oordeel staat geen beroep open (art. 9:3). De UPL noemt de dienst voor burgers en bedrijven (nr. 212).'
synoniemen:
- naam: Klacht indienen
  context: wet
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen dienst klacht; wel het bedrijfsproces Behandelen klacht, dat de wiki koppelt aan het realiserende proces. Nieuw voor GEMMA.
besluiten:
- datum: '2026-10-12'
  besluit: 'Dienst Klacht in Besluitvorming, gerealiseerd door het generieke bedrijfsproces Behandelen klacht, met het nieuwe bedrijfsobject Klaagschrift als kernobject (GGM-terugmelding hiaat) en de nieuwe rol Klager. Geen plek in de Functie-indeling naar domein: GEMMA heeft de functie Klachtenafhandeling zowel onder Juridische ondersteuning als onder Publieksdiensten, en welke elementtypen op welk niveau worden ingedeeld, moet eerst worden bepaald (todo, Indelingen).'
  gevolg: verwerkt
  stand: 'open: Functie-indeling naar domein (todo); herzien 2026-10-12: het kernobject heet Schriftelijke klacht, met Klaagschrift als synoniem (regel Bronvoorrang)'
