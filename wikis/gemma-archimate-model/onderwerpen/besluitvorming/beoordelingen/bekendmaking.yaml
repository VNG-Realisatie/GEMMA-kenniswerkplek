afnemer: extern
domein: Bestuur
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Besluitvorming
definitie: Het kenbaar maken van een besluit aan wie het aangaat, waarna het in werking treedt.
beschrijving:
- Een besluit treedt niet in werking voordat het is bekendgemaakt (Awb art. 3:40). Een besluit dat tot belanghebbenden is gericht, zoals een vergunning, wordt hun toegezonden of uitgereikt; een besluit dat niet tot belanghebbenden is gericht, wordt bekendgemaakt in het gemeenteblad (art. 3:41, 3:42; Bekendmakingswet art. 6). Wie een zienswijze gaf, krijgt een mededeling, en bekendmaking en mededeling vermelden of en bij wie bezwaar of beroep openstaat (art. 3:43–3:45). De UPL noemt de dienst voor burgers en bedrijven (nr. 47).
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen dienst bekendmaking; alleen de procesbouwsteen Bekendmaken besluit vergunningaanvraag en de functie Lokale bekendmakingen publicatie. Nieuw voor GEMMA.
besluiten:
- datum: '2026-10-12'
  besluit: 'Dienst Bekendmaking, gerealiseerd door het generieke bedrijfsproces Bekendmaken besluit, dat ook de dienst Bekendmaking algemeen verbindend voorschrift realiseert; de Bekendmakingswet is bron. Domein Bestuur in plaats van Fysieke leefomgeving uit de UPL-lijst van GEMMA: de bekendmaking geldt voor elk besluit (procesarchitectuur-terugmelding). Geen plek in de Functie-indeling naar domein: GEMMA heeft de functie Lokale bekendmakingen publicatie onder Openbare informering (Niet domeingebonden), en welke elementtypen op welk niveau worden ingedeeld, moet eerst worden bepaald (todo, Indelingen).'
  gevolg: verwerkt
  stand: 'open: Functie-indeling naar domein (todo)'
