  omschrijving: Door de gemeenteraad (art. 40 lid 1). Geen eigen pagina.
- naam: Sluiting van een begraafplaats
  omschrijving: Besluit van B&W tot sluiting of geslotenverklaring (art. 43, 44). Geen eigen pagina.
- naam: Andere termijn
  omschrijving: Door de burgemeester gestelde afwijkende termijn voor begraving of crematie (art. 17); gangbaar vervroegen of uitstellen van de uitvaart (Ondernemersplein). Geen eigen pagina.
- naam: Verklaring van verwaarlozing
  omschrijving: Schriftelijke verklaring van de houder dat het onderhoud van een particulier graf kennelijk verwaarloosd is (art. 28 lid 4). Geen eigen pagina.
- naam: Maatregel bij besmet stoffelijk overschot
  omschrijving: Maatregel van de burgemeester na advies van de GGD (art. 22a). Geen eigen pagina.
