  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
- naam: Horen belanghebbenden
  omschrijving: Het bestuursorgaan of een adviescommissie hoort de belanghebbenden, met de stukken vooraf ter inzage en een verslag (art. 7:2–7:9, 7:13).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
- naam: Beslissen op bezwaar
  omschrijving: Het bestuursorgaan heroverweegt het besluit, herroept en vervangt het zo nodig, en maakt de gemotiveerde beslissing bekend (art. 7:10–7:12).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
