taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Besluitvorming
definitie: Beschikking waarmee een bestuursorgaan toestemming geeft voor een handeling die zonder die toestemming niet mag.
beschrijving:
- Een vergunning is een beschikking (Awb art. 1:3 lid 2) waarmee een bestuursorgaan toestemming geeft voor een handeling die zonder die toestemming niet mag. Wetten noemen zo'n toestemming ook verlof, ontheffing of toestemming.
per_onderwerp:
  lijkbezorging:
  - Begraven of cremeren (verlof van de ambtenaar van de burgerlijke stand, art. 11), opgraven (art. 29), ontleden (art. 68), een bijzonder crematorium vestigen (art. 53), een bijzondere begraafplaats in gebruik nemen (art. 41), een bewaarplaats in gebruik nemen (art. 64), een verstrooiingsterrein bestemmen (art. 66b), een grafbedekking plaatsen en een grafkelder aanbrengen (Groningen art. 17, 22) mogen alleen met toestemming van de gemeente. Ze zijn specialisaties zonder eigen pagina.
synoniemen:
- naam: Verlof
  context: wet
- naam: Toestemming
  context: wet
ggm:
  sterkte: geen
  onderbouwing: 'Het GGM kent geen entiteit voor dit begrip (tools/ggm.py kandidaten: geen naamgenoten of treffers). Ontstaat in de gemeentelijke beslisprocessen: het verlof tot begraving of crematie (Wet op de lijkbezorging art. 11), Opgraven stoffelijk overschot (art. 29) en de vergunningen van art. 53, 64, 66b en 68.'
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen element voor dit begrip; nieuw voor GEMMA.
specialisaties:
- naam: Verlof tot begraving of crematie
  omschrijving: Schriftelijk verlof van de ambtenaar van de burgerlijke stand, kosteloos (art. 11, 12). Geen eigen pagina.
- naam: Vergunning tot opgraving
  omschrijving: Vergunning van de burgemeester, met voorschriften (art. 29). Geen eigen pagina.
- naam: Verlof tot ontleding
  omschrijving: Schriftelijk verlof van de burgemeester, binnen drie dagen, kosteloos (art. 68). Geen eigen pagina.
- naam: Vergunning bijzonder crematorium
  omschrijving: Vergunning van B&W voor vestigen, uitbreiden of wijzigen (art. 53). Geen eigen pagina.
- naam: Toestemming ingebruikneming bijzondere begraafplaats
  omschrijving: Toestemming van B&W (art. 41). Geen eigen pagina.
- naam: Vergunning bewaarplaats
  omschrijving: Vergunning van B&W voor een bewaarplaats van asbussen (art. 64). Geen eigen pagina.
- naam: Vergunning verstrooiingsterrein
  omschrijving: Vergunning van B&W voor een terrein om permanent as op te verstrooien (art. 66b). Geen eigen pagina.
- naam: Vergunning grafbedekking
  omschrijving: Vergunning van het college, aangevraagd door de rechthebbende (Groningen art. 22; VNG-modelverordening art. 19). Geen eigen pagina.
- naam: Vergunning grafkelder
  omschrijving: Vergunning van het college aan de rechthebbende voor het aanbrengen van een grafkelder (Groningen art. 17; VNG-modelverordening art. 16). Geen eigen pagina.
- naam: Toestemming asverstrooiing
  omschrijving: Ontheffing van het college van het verbod op asverstrooiing buiten de begraafplaats (APV Groningen art. 5:27 lid 3) en toestemming voor verstrooiing op een aangewezen plek op de begraafplaats (Groningen art. 21). Geen eigen pagina.
- naam: Laissez-passer voor lijken
  omschrijving: Document van de burgemeester voor vervoer van een stoffelijk overschot naar een verdragsstaat van de Overeenkomst van Straatsburg (Besluit op de lijkbezorging art. 11). Geen eigen pagina.
