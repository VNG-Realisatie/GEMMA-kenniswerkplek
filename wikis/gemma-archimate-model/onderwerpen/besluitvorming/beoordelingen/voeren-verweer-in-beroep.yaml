  onderbouwing: Het GEMMA-model kent geen proces voor beroep; de interne UPL-lijst van GEMMA noemt Beroep behandelen als ondersteunend proces (2025-vng-upl-producten-en-diensten-intern, nr. 33). Nieuw voor GEMMA.
