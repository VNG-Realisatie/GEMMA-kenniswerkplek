begrip: Beleidsnota
vak: bedrijf/passief
hoofdkenmerk: object
onderwerpen:
- besluitvorming
- participatie
kenmerken:
  wordt_bewerkt:
    waarde: ja
    naar:
    - betrekken-inwoners-bij-beleid
    - uitvoeren-uniforme-openbare-voorbereidingsprocedure
  generiek:
    waarde: ja
    onderbouwing: Komt met dezelfde betekenis voor in elk onderwerp waarvoor de gemeente beleid vaststelt.
    bronnen:
    - 2026-rijk-gemeentewet-wettekst
definitie: Document waarin de gemeente haar beleid voor een onderwerp vastlegt, met de doelen en uitgangspunten.
beschrijving:
- De gemeente betrekt ingezetenen en belanghebbenden bij de voorbereiding, uitvoering en evaluatie van haar beleid; de raad stelt daarvoor regels vast in een verordening, en inspraak verloopt via de uniforme openbare voorbereidingsprocedure tenzij de verordening anders bepaalt (Gemeentewet art. 150). De gemeenteraad legt beleid vast, bijvoorbeeld de uitgangspunten voor participatie (VNG-implementatiehandleiding model participatieverordening, bijlage 2).
- Een beleidsnota is geen algemeen verbindend voorschrift, zoals een verordening (Regeling), en geen beleidsregel over het gebruik van één bevoegdheid (Awb art. 1:3 lid 4).
synoniemen:
- naam: Gemeentelijk beleid
  context: wet
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Besluitvorming
ggm:
  sterkte: geen
  onderbouwing: 'Het GGM kent geen beleidsnota of gemeentelijk beleid. Het ontstaat in het vaststellen van beleid door de raad (Gemeentewet art. 150; VNG-implementatiehandleiding, bijlage 2), een proces dat de wiki nog niet heeft (in GEMMA: Ontwikkelen regelingen, verordeningen en beleid).'
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen element voor dit begrip; nieuw voor GEMMA. Het vaststellen ervan valt onder het GEMMA-proces Ontwikkelen regelingen, verordeningen en beleid (id-e240247c-c05a-4f50-8dd1-534658504e38).
specialisaties:
- naam: Participatiebeleid
  omschrijving: Beleid van de gemeenteraad met de uitgangspunten voor participatie, waarnaar de participatieverordening en het plan voor inwonersparticipatie kunnen verwijzen (VNG-implementatiehandleiding, bijlage 2; var. 1 art. 3). Geen eigen pagina.
bronnen:
