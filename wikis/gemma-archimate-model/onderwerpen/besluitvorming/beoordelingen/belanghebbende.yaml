  omschrijving: Belanghebbende die een aanvraag indient en de gegevens en bescheiden verschaft (Awb art. 1:3 lid 3, 4:2). Geen eigen pagina; in een onderwerp heet de rol naar het object, zoals Houder van het reisdocument.
- naam: Belanghebbende bij een algemeen graf
  omschrijving: Nabestaande die bericht krijgt van het verstrijken van de termijn van uitgifte en van de ruiming (Wlb art. 27a; VNG-modelverordening art. 24). Geen eigen pagina.
