  id: id-bd369f13-44a4-41f0-8b95-7925a0c0eaa9
  sterkte: sterk
  onderbouwing: 'GEMMA-rol Belanghebbende uit de procesbouwstenen; zelfde begrip, in GEMMA zonder definitie. Nieuw: een definitie volgens de Awb. Het GEMMA-bedrijfsobject Belanghebbende (groepering Museum, uit het GGM) is de gegevensentiteit, geen rol.'
