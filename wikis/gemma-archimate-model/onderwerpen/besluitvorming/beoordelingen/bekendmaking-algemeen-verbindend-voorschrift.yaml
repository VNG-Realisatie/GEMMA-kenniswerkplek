definitie: Het publiceren van een verordening of andere algemeen verbindende regel van de gemeente in het gemeenteblad, waarna zij geldt.
beschrijving:
- Het college van burgemeester en wethouders geeft een gemeenteblad uit, elektronisch en kosteloos toegankelijk (Bekendmakingswet art. 2 lid 2, 3). Algemeen verbindende voorschriften van de gemeente, zoals verordeningen, en ook beleidsregels en andere besluiten die niet tot belanghebbenden zijn gericht, worden bekendgemaakt door plaatsing in het gemeenteblad (art. 6). Een algemeen verbindend voorschrift treedt pas na bekendmaking in werking, zonder andere aanduiding op de achtste dag erna (art. 8, 10 lid 2). De UPL noemt de dienst voor burgers en bedrijven (nr. 48).
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen dienst voor de bekendmaking van algemeen verbindende voorschriften; wel de buitengemeentelijke service Geconsolideerde teksten digitaal ter beschikking te stellen (CVDR), een andere dienst. Nieuw voor GEMMA.
