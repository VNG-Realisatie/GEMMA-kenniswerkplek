  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
- naam: Beslissen op aanvraag nadeelcompensatie
  omschrijving: Het bestuursorgaan kent de vergoeding toe, met kosten en rente, of wijst de aanvraag af (art. 4:126, 4:129–4:131).
  bronnen:
  - 2026-rijk-algemene-wet-bestuursrecht-wettekst
