- naam: Plaatsen in het gemeenteblad
  omschrijving: Een algemeen verbindend voorschrift, een beleidsregel of een besluit zonder geadresseerden wordt in het gemeenteblad geplaatst (Awb art. 3:42; Bekendmakingswet art. 6).
  bronnen:
