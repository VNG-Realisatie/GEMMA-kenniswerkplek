toelichting: 'Onderdeel van Ingeschreven persoon (categorie 04 van de persoonslijst), zonder eigen bedrijfsproces: geen pagina. De Nederlandse nationaliteit heeft wel eigen processen (optie, naturalisatie, afstand) en is als Nederlanderschap een eigen element, kernobject van Beheren Nederlanderschap; de andere nationaliteiten neemt de gemeente alleen op en beëindigt ze in de bijhouding van de persoonsgegevens, op grond van brondocumenten of een mededeling van de minister (HUP Nationaliteit; HUP Vreemde nationaliteit; HUP Onbekende nationaliteit). Vreemde nationaliteit, onbekende nationaliteit en staatloosheid zijn waarden van dit gegeven zonder pagina; stapels, codes en redenen blijven buiten het model.'
