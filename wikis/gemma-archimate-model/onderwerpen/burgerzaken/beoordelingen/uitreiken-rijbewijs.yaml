begrip: Uitreiken rijbewijs
vak: bedrijf/gedrag-intern
soort_gedrag: per_keer_doorlopen
onderwerpen:
- burgerzaken
kenmerken:
  toegewezen_partij:
    waarde: ja
    onderbouwing: De Houder van het rijbewijs haalt het persoonlijk op, identificeert zich en levert zijn oude rijbewijs in (Wegenverkeerswet 1994 art. 111 lid 2, 119 lid 2; Utrecht).
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
    - 2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen
  gebruikt_objecten:
    waarde: ja
    onderbouwing: 'Werkt het rijbewijs bij: uitgereikt aan de houder; het eerdere rijbewijs wordt ingeleverd en doorgeleid of teruggestuurd (Wegenverkeerswet 1994 art. 115, 119 lid 2, 120 lid 2; Reglement rijbewijzen art. 109).'
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
    - 2026-rijk-reglement-rijbewijzen-bwbr0008074
  aanleiding:
    waarde: ja
    onderbouwing: 'De afgifte: het rijbewijs ligt klaar, twee werkdagen na een online aanvraag en vijf werkdagen na een aanvraag aan de balie (Utrecht).'
    bronnen:
    - 2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen
  benoembaar_resultaat:
    waarde: ja
    onderbouwing: Het rijbewijs in handen van de houder, of een rijbewijs dat bij degene die afgeeft blijft (Wegenverkeerswet 1994 art. 120a).
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
  komt_herhaald_voor:
    waarde: ja
    onderbouwing: Voor elk afgegeven rijbewijs.
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
    - 2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen
  eigen_normering:
    waarde: ja
    onderbouwing: Wegenverkeerswet 1994 art. 111 lid 2, 115, 119 lid 2, 120 lid 2 en 120a (identificatie bij uitreiking, inneming, inlevering van het eerdere rijbewijs, geen uitreiking bij nieuwe omstandigheden).
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
  bijdrage_aan_groter_proces:
    waarde: ja
    onderbouwing: 'Draagt bij aan Beheren rijbewijzen: het rijbewijs komt in gebruik.'
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
  klant_tot_klant:
    waarde: nee
    onderbouwing: Nee, volgt op de afgifte in Behandelen aanvraag rijbewijs, voor hetzelfde geval; pas met de uitreiking is de dienst geleverd.
    bronnen:
    - 2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
  omvat_levensloop:
    waarde: nee
    onderbouwing: Niet bij dit gedrag aanwijsbaar.
  eigen_besluit:
    waarde: nee
    onderbouwing: De uitreiking is een feitelijke handeling; de beslissing ligt bij de afgifte (Wegenverkeerswet 1994 art. 116, 118a); alleen het niet uitreiken volgt uit art. 120a.
    bronnen:
    - 2026-rijk-wegenverkeerswet-1994-bwbr0006622
  levert_aanbod:
    waarde: nee
    onderbouwing: De diensten worden gerealiseerd door Behandelen aanvraag rijbewijs; het ophalen is de levering daarvan (Utrecht).
    bronnen:
    - 2026-utrecht-burgerzaken-rijbewijs-aanvragen-of-verlengen
  leidt_tot_gebeurtenis:
    waarde: nee
    onderbouwing: Niet bij dit gedrag aanwijsbaar.
definitie: Het na de afgifte ter beschikking stellen van het rijbewijs aan de aanvrager, die daarbij zijn eerdere rijbewijs inlevert.
synoniemen:
- naam: Uitreiking van het rijbewijs
  context: wet
- naam: Rijbewijs ophalen
  context: beleid
