toelichting: 'Voorgelegd, samen met de minister van BZK: de IND beslist namens de minister van Justitie en Veiligheid over naturalisatie (Besluit verkrijging en verlies Nederlanderschap art. 37, 38: Onze Minister; Utrecht: de IND) en levert de verblijfstitels voor de BRP (HUP Verblijfstitel), maar is één organisatie en geen soort partij. Zolang de redacteur niet anders beslist: geen element; de rol Ketenpartner is toegewezen aan Beheren Nederlanderschap en de IND staat in de beschrijvingen.'
