definitie: 'Wet die de basisregistratie personen regelt: de inschrijving en bijhouding van gegevens over ingezetenen en niet-ingezetenen en de verstrekking daarvan.'
beschrijving:
- De Wet BRP wordt uitgewerkt in het Besluit BRP, de Regeling BRP en het Logisch Ontwerp BRP (Besluit BRP; LO BRP). Het college houdt de gegevens van de ingezetenen bij; de minister van BZK de RNI en de centrale voorzieningen (HUP Achtergronden). De UPL noemt de wet als grondslag van onder meer de BRP-inschrijving, de verhuismelding, de aangifte van vertrek, het briefadres, het uittreksel en de geheimhouding (UPL).
synoniemen:
- naam: Wet BRP
  context: dagelijks gebruik
taakveld: 0 Bestuur en Ondersteuning
beleidsdomein: Burgerzaken
naamkeuze:
- De naam is de titel van de wet (BWBR0033715), zoals een beleidskader heet (precedent Wet op de lijkbezorging); Wet BRP is de afkorting in dagelijks gebruik en blijft synoniem.
per_onderwerp:
  burgerzaken:
  - 'In Burgerzaken is geen UPL-item een product: geen enkel item bundelt diensten met een afspraak voor de afnemer (kenmerk omvat diensten en afspraken). De BRP-items zijn diensten die bedrijfsprocessen onder Bijhouden persoonsgegevens realiseren; de wet is daarom grondslag van die diensten en bedrijfsprocessen (UPL nr. 1, 6, 62, 85 tot en met 95, 257, 335, 369, 424) en niet van een product.'
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen beleidskader voor deze wet; nieuw voor GEMMA.
