  context: beleid
naamkeuze:
- De UPL-naam letterlijk (regel Naamvorm); de wetsterm aangifte van overlijden (BW 1 art. 19h), tot 2026-10-07 de naam van deze beoordeling, is een synoniem.
gemma:
