specialisaties:
- naam: Akte van geboorte
  omschrijving: 'Opgemaakt in de gemeente van geboorte na de aangifte van geboorte (BW 1 art. 19, 19e; Besluit burgerlijke stand art. 43). Gangbaar: geboorteakte. Geen eigen pagina.'
- naam: Akte van geboorte levenloos geboren kind
  omschrijving: Opgemaakt na de aangifte van een levenloos geboren kind en opgenomen in het register van overlijden (BW 1 art. 19i; Besluit burgerlijke stand art. 66). Geen eigen pagina.
- naam: Akte van erkenning
  omschrijving: Opgemaakt als een man of vrouw een kind erkent, ook vóór de geboorte (BW 1 art. 203; Besluit burgerlijke stand art. 49). Geen eigen pagina.
- naam: Akte van naamskeuze
  omschrijving: Opgemaakt op de verklaring van de ouders over de geslachtsnaam van het kind (BW 1 art. 5; Besluit burgerlijke stand art. 52a). Geen eigen pagina.
- naam: Huwelijksakte
  omschrijving: Opgemaakt bij de voltrekking van het huwelijk (BW 1 art. 63; Besluit burgerlijke stand art. 57). Geen eigen pagina.
- naam: Akte van registratie van partnerschap
  omschrijving: Opgemaakt bij de registratie van een geregistreerd partnerschap (BW 1 art. 80a lid 3; Besluit burgerlijke stand art. 57a). Geen eigen pagina.
- naam: Akte van omzetting
  omschrijving: Opgemaakt bij de omzetting van een geregistreerd partnerschap in een huwelijk (BW 1 art. 80g; Besluit burgerlijke stand art. 57c). Geen eigen pagina.
- naam: Akte van inschrijving
  omschrijving: Waarmee een rechterlijke uitspraak, zoals een echtscheiding, of een buiten Nederland opgemaakte akte in de registers wordt ingeschreven (BW 1 art. 25; Besluit burgerlijke stand art. 60, 60a). Geen eigen pagina.
- naam: Akte van overlijden
  omschrijving: 'Opgemaakt in de gemeente van overlijden na de aangifte van overlijden, ook bij lijkvinding (BW 1 art. 19f, 19h; Besluit burgerlijke stand art. 61-65). Gangbaar: overlijdensakte. Geen eigen pagina.'
