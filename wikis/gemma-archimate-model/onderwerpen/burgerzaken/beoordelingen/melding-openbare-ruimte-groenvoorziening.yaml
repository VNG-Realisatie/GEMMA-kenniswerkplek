begrip: Melding openbare ruimte groenvoorziening
hoofdkenmerk: gedrag
onderwerpen:
- burgerzaken
kenmerken:
  betekenis_in_onderwerp:
    waarde: nee
    onderbouwing: 'Hoort niet bij Burgerzaken: het gaat om een melding over de openbare ruimte (UPL-domein Fysieke leefomgeving, zonder grondslag), geen taak uit de BRP, de burgerlijke stand, de reisdocumenten, het kiesrecht of het Nederlanderschap. Beoordelen in een later onderwerp openbare ruimte, een onderwerp dat nog niet bestaat.'
toelichting: 'Verwijzing: UPL-product nr. 244 (zonder grondslag) staat onder Iv3-taakveld 0.2, maar valt buiten de afbakening van Burgerzaken (BRP, burgerlijke stand, reisdocumenten, kiesrecht en Nederlanderschap): het gaat om een melding over de openbare ruimte (UPL-domein Fysieke leefomgeving, zonder grondslag), geen taak uit de BRP, de burgerlijke stand, de reisdocumenten, het kiesrecht of het Nederlanderschap. Het product krijgt zijn pagina in een later onderwerp openbare ruimte.'
bronnen:
- 2025-vng-upl-producten-en-diensten-extern
