genoemd_begrip: Behandelen naturalisatieverzoek
kenmerken:
  afhankelijkheid:
    waarde: onderdeel
    onderbouwing: Wordt alleen als uittreksel uitgereikt in Houden naturalisatieceremonie; het besluit zelf neemt de Koning op voordracht van de minister (Rijkswet art. 7; Besluit art. 38, 60b).
toelichting: 'Onderdeel, geen pagina: het besluit tot verlening van het Nederlanderschap is een Koninklijk besluit op voordracht van de minister van Justitie en Veiligheid; de minister zendt de uittreksels aan de burgemeester van de woonplaats, die ze uitreikt in Houden naturalisatieceremonie (Rijkswet op het Nederlanderschap art. 7; Besluit verkrijging en verlies Nederlanderschap art. 38, 60b). De gemeente maakt het niet zelf.'
