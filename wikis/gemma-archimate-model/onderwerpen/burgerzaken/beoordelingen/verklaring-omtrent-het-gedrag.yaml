ggm:
  sterkte: geen
  onderbouwing: 'Het GGM kent geen verklaring omtrent het gedrag. De gegevens over de verklaring worden bij de minister beheerd en niet door de gemeente, daarom is geen hiaat teruggemeld (zie de vraag bij Afgeven verklaring omtrent het gedrag). Ontstaat in Afgeven verklaring omtrent het gedrag: de minister geeft de verklaring af op een aanvraag die de gemeente ontvangt en doorzendt (2026-rijk-wet-justitiele-en-strafvorderlijke-gegevens-bwbr0014194, art. 28, 30, 37).'
