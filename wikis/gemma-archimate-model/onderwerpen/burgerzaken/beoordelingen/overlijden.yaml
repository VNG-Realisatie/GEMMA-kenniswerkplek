besluiten:
- datum: '2026-10-04'
  besluit: 'Niet generiek: Overlijden is een specifieke gebeurtenis, geen specialisatie van een generieke GEMMA-gebeurtenis; geen voorstel aan GEMMA.'
  gevolg: verwerkt
- datum: '2026-10-05'
  besluit: 'Stoffelijk overschot in lopende tekst: per onderwerp lijkbezorging.'
  gevolg: verwerkt
- datum: '2026-10-07'
  besluit: 'Thuisonderwerp Burgerzaken (regel Thuishoren): het overlijden verandert de toestand van de Ingeschreven persoon en wordt vastgelegd in de akte van overlijden (BW 1 art. 19f, 19h); Lijkbezorging gebruikt de gebeurtenis met een relatie, de tekst voor lijkbezorging staat per onderwerp. Het object in Archi blijft.'
  gevolg: verwerkt
- datum: '2026-10-08'
  besluit: 'Overlijden leidt tot de akte (Opmaken akte van overlijden, daarna Verlenen verlof) en tot het begraven of cremeren (Uitvoeren lijkbezorging). Bijzetten of verstrooien van de as wordt een deelproces van Uitvoeren lijkbezorging. Schouwen stoffelijk overschot blijft een eigen bedrijfsproces (de schouw gebeurt vóór de aangifte en de aanvraag van het verlof, door een andere rol); de verklaring van overlijden gaat als stroom naar Verlenen verlof (Wlb art. 12). Afgewezen: Schouwen als deelproces van Verlenen verlof.'
  gevolg: verwerkt
specialisaties:
- naam: Lijkvinding
  omschrijving: Het vinden van een stoffelijk overschot van een onbekende of niet aangegeven overledene; de hulpofficier van justitie doet aangifte en datum en plaats van de vinding gelden als die van het overlijden (Besluit burgerlijke stand art. 62; HUP Lijkvinding). Geen eigen pagina.
- naam: Rechtsvermoeden van overlijden
  omschrijving: Een uitspraak van de rechtbank dat een vermiste wordt vermoed te zijn overleden, ingeschreven in de registers (HUP Rechtsvermoeden van overlijden). Geen eigen pagina.
- naam: Overlijden in het buitenland
  omschrijving: Verwerkt op een buitenlandse, consulaire of Haagse akte (HUP Overlijden buitenland). Geen eigen pagina.
