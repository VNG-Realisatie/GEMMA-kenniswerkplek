    onderbouwing: De uitreiking is een feitelijke handeling; de beslissing ligt bij de verstrekking (Paspoortwet art. 1 onder d en e).
  levert_aanbod:
    waarde: nee
    onderbouwing: De diensten worden gerealiseerd door Behandelen aanvraag reisdocument; het ophalen of laten bezorgen is de levering daarvan (Utrecht).
