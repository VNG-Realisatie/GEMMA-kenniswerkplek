    bronnen:
    - 2026-rijk-paspoortwet-bwbr0005212
    - 2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-aanvragen
  benoembaar_resultaat:
    waarde: ja
    onderbouwing: Het reisdocument in handen van de houder (Paspoortwet art. 1 onder e).
    bronnen:
    - 2026-rijk-paspoortwet-bwbr0005212
  komt_herhaald_voor:
    waarde: ja
