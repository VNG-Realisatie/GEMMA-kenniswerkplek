    - 2026-utrecht-burgerzaken-paspoort-of-identiteitskaart-aanvragen
  eigen_normering:
    waarde: ja
    onderbouwing: Paspoortwet art. 32 en 42 (inlevering, termijn van twee weken, geen uitreiking bij een mededeling tot inhouding, onttrekking na drie maanden); Paspoortbesluit art. 4.6 (identiteit vaststellen in aanwezigheid).
    bronnen:
    - 2026-rijk-paspoortwet-bwbr0005212
    - 2026-rijk-paspoortbesluit-bwbr0044308
  bijdrage_aan_groter_proces:
