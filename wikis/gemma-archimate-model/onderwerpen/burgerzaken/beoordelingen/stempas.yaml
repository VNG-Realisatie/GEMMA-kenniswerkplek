- naam: Kiezerspas
  omschrijving: Verklaring op verzoek waarmee de kiezer in een stembureau naar keuze in het gebied van de verkiezing kan stemmen; ze komt in de plaats van de stempas, die ongeldig wordt, en wordt niet vervangen (Kieswet art. K 1, K 4, J 7a lid 2 onder a). Geen eigen pagina; de dienst Kiezerspas levert haar.
