ggm:
  sterkte: geen
  onderbouwing: 'Het GGM kent geen stempas en geen ander begrip voor de verkiezingen (GGM-terugmelding 17). Ontstaat in Beheren stempassen: de burgemeester verstrekt de stempas aan elke geregistreerde kiezer (2026-rijk-kieswet-bwbr0004627, art. J 7).'
gemma:
  sterkte: geen
  onderbouwing: Het GEMMA-model kent geen bedrijfsobject voor de stempas; de functie Verkiezingen gerelateerde diensten noemt het verstrekken van stempassen als voorbeeld. Nieuw voor GEMMA.
