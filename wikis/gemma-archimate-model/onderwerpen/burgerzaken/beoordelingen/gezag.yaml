genoemd_begrip: Bijhouden persoonsgegevens
toelichting: 'Invoer van een andere partij, geen pagina: het gezag ontstaat van rechtswege of bij beschikking van de rechtbank en staat in het gezagsregister van de rechtbank (BW 1 art. 244, 252); de gemeente neemt het over in de BRP in Bijhouden persoonsgegevens en verstrekt het met de dienst BRP-uittreksel met gezag. Alleen bij de erkenning legt de ambtenaar van de burgerlijke stand vast of de moeder alleen gezag heeft (BW 1 art. 251b). Vormen: ouderlijk gezag (gezamenlijk of eenhoofdig) en voogdij; de gezagsverhouding in de BRP omvat ook curatele, die het gezag over een minderjarige uitsluit (HUP Gezagsverhouding). De GGM-entiteit Gezagsverhouding (Sociaal domein generiek) beschrijft hetzelfde begrip.'
