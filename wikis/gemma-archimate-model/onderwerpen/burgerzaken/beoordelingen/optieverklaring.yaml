genoemd_begrip: Behandelen optieverklaring
kenmerken:
  afhankelijkheid:
    waarde: onderdeel
    onderbouwing: Het verzoek waarmee Behandelen optieverklaring begint; het bestaat niet los van dat bedrijfsproces (Besluit art. 7).
toelichting: 'Onderdeel, geen pagina: de verklaring waarmee Behandelen optieverklaring begint, schriftelijk, ondertekend en in persoon afgelegd, met de gegevens van de optant en van wie hij in zijn optie betrekt (Besluit verkrijging en verlies Nederlanderschap art. 3, 6, 7). De burgemeester bewaart haar twaalf jaar en zendt een afschrift aan de minister (art. 12). Precedent: Aanvraag reisdocument.'
