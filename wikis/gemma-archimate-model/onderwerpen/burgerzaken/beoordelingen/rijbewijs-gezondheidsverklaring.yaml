    onderbouwing: 'Bestaat niet los van het besluit over de aanvraag: de gemeente controleert de verklaring van geschiktheid die het CBR registreert als onderdeel van Behandelen aanvraag rijbewijs (Reglement rijbewijzen art. 35, 45), en heeft er geen eigen handeling voor; de aanvraag en registratie liggen bij het CBR (art. 97, 100).'
