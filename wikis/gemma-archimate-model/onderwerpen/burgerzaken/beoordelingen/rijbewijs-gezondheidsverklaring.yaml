genoemd_begrip: Rijbewijs aanvragen
toelichting: 'Onderdeel (subdienst), geen pagina: de UPL noemt de gezondheidsverklaring als zelfstandig product (nr. 362, art. 100 Reglement rijbewijzen), maar de gemeente heeft er geen eigen handeling voor. Ze controleert bij de aanvraag of de verklaring van geschiktheid bij het CBR is geregistreerd, als onderdeel van de dienst Rijbewijs aanvragen en van het bedrijfsproces Behandelen aanvraag rijbewijs (Reglement rijbewijzen art. 35 en 45). De aanvrager koopt de gezondheidsverklaring bij het CBR en de gemeente verkoopt of ontvangt haar niet (Utrecht); het CBR registreert de verklaring van geschiktheid (art. 97, 100). Zie procesarchitectuur-terugmelding 18.'
synoniemen:
- naam: Gezondheidsverklaring en medische keuring voor rijbewijs
  context: beleid
besluiten:
- datum: '2026-10-07'
  besluit: 'Geen zelfstandige dienst maar een subdienst: onderdeel van het besluit over de aanvraag (Rijbewijs aanvragen, Behandelen aanvraag rijbewijs); de gemeente controleert de verklaring van geschiktheid bij het CBR. Terugmelding aan de procesarchitectuur (18).'
  gevolg: verwerkt
