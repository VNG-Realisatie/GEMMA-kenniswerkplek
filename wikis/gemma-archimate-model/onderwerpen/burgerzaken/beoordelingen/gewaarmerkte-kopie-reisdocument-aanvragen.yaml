- Dienst vanuit de afnemer (regel Naamvorm), naar de productpagina van Utrecht; de UPL kent het product niet. De kortere vorm, met gewaarmerkte kopie als wat de afnemer krijgt, is gekozen boven de volledige Utrechtse titel, die als synoniem blijft.
toelichting: 'Vervalt: geen landelijke wettelijke grondslag (niet in de Paspoortwet, het Paspoortbesluit of de Wet op de Nederlandse identiteitskaart) en geen product in de UPL; gemeenten verschillen in wat ze waarmerken (regel Wettelijke grondslag; procesarchitectuur-terugmelding 11).'
