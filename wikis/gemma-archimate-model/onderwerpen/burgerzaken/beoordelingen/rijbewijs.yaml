specialisaties:
- naam: Beginnersrijbewijs
  omschrijving: 'Het eerste rijbewijs, tien jaar geldig; de eerste vijf jaar is de straf bij verkeersovertredingen zwaarder (Utrecht). Geen eigen pagina: dezelfde gegevens en hetzelfde bedrijfsproces.'
- naam: Bromfietsrijbewijs
  omschrijving: Voor bromfietsen (categorie AM); aanvragen gaat als een eerste rijbewijs en vraagt geen verklaring van geschiktheid (Utrecht; Reglement rijbewijzen art. 45). Geen eigen pagina.
- naam: Groot rijbewijs
  omschrijving: Voor vrachtwagen of bus (categorieën C en D); altijd een medische keuring, ook bij verlengen (Utrecht; Reglement rijbewijzen art. 35). Geen eigen pagina.
- naam: Vervangend rijbewijs
  omschrijving: 'Afgegeven in de bij algemene maatregel van bestuur aangegeven gevallen, na vermissing of bij versleten rijbewijs of omwisseling; het oude rijbewijs wordt ingeleverd, tenzij het verloren is (Wegenverkeerswet 1994 art. 120; Reglement rijbewijzen art. 105a). Geen eigen pagina: het UPL kent het niet apart.'
- naam: Internationaal rijbewijs
  omschrijving: 'De burgemeester is bevoegd het af te geven voor het verkeer met motorrijtuigen in het buitenland (Wegenverkeerswet 1994 art. 117). Geen eigen pagina: de UPL en Utrecht noemen het niet.'
