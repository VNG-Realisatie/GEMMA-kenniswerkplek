specialisaties:
- naam: Nationaal paspoort
  omschrijving: 'Voor iedere Nederlander, voor alle landen, tien jaar en tot achttien jaar vijf jaar geldig (Paspoortwet art. 9; Paspoortbesluit art. 2.2). Gangbaar: paspoort; ook als tweede paspoort (art. 30) en als zakenpaspoort met 66 bladzijden (Utrecht). Geen eigen pagina; de diensten Paspoort, Paspoort tweede en Zakenpaspoort leveren het.'
  ggm_attribuut: soort
- naam: Nederlandse identiteitskaart
  omschrijving: Identiteitsbewijs met een eigen wet, voor een deel van de landen als reisdocument te gebruiken (Paspoortwet art. 1 onder u; Utrecht). Geen eigen pagina; de dienst Identiteitskaart levert het.
  ggm_attribuut: soort
- naam: Reisdocument voor vluchtelingen
  omschrijving: 'Voor een als vluchteling toegelaten vreemdeling, vijf jaar geldig (Paspoortwet art. 11). Gangbaar: vluchtelingenpaspoort. Geen eigen pagina.'
  ggm_attribuut: soort
- naam: Reisdocument voor vreemdelingen
  omschrijving: 'Voor een vreemdeling die geen eigen nationaal paspoort kan krijgen (Paspoortwet art. 12 tot en met 15). Gangbaar: vreemdelingenpaspoort. Geen eigen pagina.'
  ggm_attribuut: soort
- naam: Nooddocument
  omschrijving: 'Laissez-passer of noodpaspoort bij een reis die geen uitstel gedoogt (Paspoortwet art. 16; Paspoortbesluit art. 2.10). Geen gemeentelijk product: de Koninklijke Marechaussee neemt de aanvraag in ontvangst (Paspoortbesluit art. 3.5; Utrecht). Geen eigen pagina.'
- naam: Faciliteitenpaspoort
  omschrijving: 'Voor een staatloze die op grond van de Wet betreffende de positie van Molukkers als Nederlander wordt behandeld; de burgemeester neemt de aanvraag in ontvangst (Paspoortbesluit art. 2.12, 3.1). Geen eigen pagina: de UPL noemt het niet apart.'
- naam: Diplomatiek paspoort en dienstpaspoort
  omschrijving: Verstrekt door de minister van Buitenlandse Zaken, niet door de gemeente (Paspoortwet art. 10, 40 lid 2). Geen eigen pagina.
