naamkeuze:
- 'Infinitief met object in GEMMA-volgorde, zoals Beheren reisdocumenten: het proces omvat de hele levensloop van het rijbewijs waarbij de gemeente handelt, van aanvraag en afgifte tot vermissing. Verstrekken rijbewijs is overwogen, maar de wet kent afgifte en uitreiking als twee momenten (Wegenverkeerswet 1994 art. 116, 120a).'
