key: gemma-archimate-model
type: curation                       # sync | curation | knowledge-base

sources:
  tags: []                           # vast te stellen bij de eerste ingest
  exclude_tags: []

# Leesvolgorde op brontype (sources/index `brontype`); zie de regel Bronvoorrang.
# Brontype `model` (het GGM en het GEMMA-model) is een matchdoel, geen bron voor begrippen.
bronvoorrang: [europese-regelgeving, rijksregelgeving, informatiemodel, richtlijn, gemeentelijke-regelgeving, beleid, overig]

page_types:                          # pagina's van curated typen en onderwerpen maakt tools/render.py; zonder schema
  onderwerp:
    files: onderwerpen/*/begrippen.md   # begrippenlijst per onderwerp (gegenereerd uit de beoordelingen)
  overzicht:
    files: onderwerpen/*/overzicht.md   # overzicht per onderwerp: de views op de indelingen (gegenereerd)
  indeling:
    files: elementpaginas/overig/indelingen/*.md   # de indelingen as-is met dekking (onderwerpen, beleidsdomeinen, bedrijfsfuncties; gegenereerd)
  bronduiding:
    files:                           # laag 3: wat een bron betekent vanuit het perspectief van de wiki
      - onderwerpen/*/bronduidingen/*/*.md
      - modellen/*/bronduidingen/*/*.md
    schema: schemas/bronduiding.schema.json
  kennismodel:                       # wat het model is: elementtypen, relaties, indelingen (tools/kennismodel.py; modelleerregels.md met de hand)
    dir: kennismodel
    schema: schemas/kennismodel.schema.json
  lijst:                             # wat een script als lijst maakt: terugmeldingen/, ter-beoordeling.md, voortgang.md; geen eigen map
    schema: schemas/lijst.schema.json
  bedrijfsobject:                    # archimate_type business-object | contract
    dir: elementpaginas/bedrijfsarchitectuur/bedrijfsobjecten
    submappen: [taakveld, beleidsdomein]
    curated: true
  product:
    dir: elementpaginas/bedrijfsarchitectuur/producten
    submappen: [taakveld, beleidsdomein]
    curated: true
  dienst:                            # GEMMA-naam Dienst (Business Service)
    dir: elementpaginas/bedrijfsarchitectuur/diensten
    submappen: [taakveld, beleidsdomein]
    curated: true
  bedrijfsproces:
    dir: elementpaginas/bedrijfsarchitectuur/bedrijfsprocessen
    submappen: [taakveld, beleidsdomein]
    curated: true
  bedrijfsinteractie:                # Business Interaction, zoals een ketensamenwerking; map naar het kernobject
    dir: elementpaginas/bedrijfsarchitectuur/bedrijfsinteracties
    submappen: [taakveld, beleidsdomein]
    curated: true
  bedrijfsfunctie:                   # Functie-indeling naar domein, niet de Beleidsdomeinindeling
    dir: elementpaginas/bedrijfsarchitectuur/bedrijfsfuncties
    submappen: [domein]
    curated: true
  gebeurtenis:                       # GEMMA-naam Gebeurtenis (Business Event)
    dir: elementpaginas/bedrijfsarchitectuur/gebeurtenissen
    curated: true
  actor:
    dir: elementpaginas/bedrijfsarchitectuur/actoren
    curated: true
  rol:
    dir: elementpaginas/bedrijfsarchitectuur/rollen
    curated: true
  bedrijfssamenwerking:              # Business Collaboration, zonder eigen rechtspersoon
    dir: elementpaginas/bedrijfsarchitectuur/bedrijfssamenwerkingen
    curated: true
  kanaal:                            # Business Interface; één centrale set
    dir: elementpaginas/bedrijfsarchitectuur/kanalen
    curated: true
  data-object:                       # Data Object (applicatielaag); afgeleid uit de GGM-match van het element (tools/beslissen.py)
    dir: elementpaginas/applicatiearchitectuur/data-objecten
    curated: true
  capability:                        # Capability (strategielaag); een element als ten minste twee functies haar realiseren
    dir: elementpaginas/strategie/capabilities
    submappen: [domein]
    curated: true
  beleidskader:                      # Driver (motivatielaag); Europese of rijksregelgeving of VNG-modelverordening
    dir: elementpaginas/motivatie/beleidskaders
    submappen: [grondslag]           # de groep in de Grondslagindeling, afgeleid uit de regelgever (het brontype van de regeling)
    curated: true

curation:
  beoordelingen: onderwerpen/*/beoordelingen   # het oordeel van de AI per begrip (YAML), in de map van het thuisonderwerp; zie ARCHITECTURE.md
  beslissen: tools/beslissen.py              # type, status en modelvelden; daarna de render
  render: tools/render.py                  # alle pagina's uit de beoordelingen
  states: [kandidaat, review, goedgekeurd, afgewezen]
  gated: [goedgekeurd]
  approval: chat                     # AKKOORD in de chat na het bekijken van de pagina's (llmwiki promote plan/apply)
  min_reviewers: 1

# Actuele modelbronnen (bron-id's in sources/index), gezet door tools/ggm.py en tools/gemma.py `release`.
ggm:
  bron: 2026-vng-ggm-2-5-1
  herkomst:                          # waar tools/ggm.py release het XMI ophaalt (zelfde locatie als de vorige wiki)
    repository: Gemeente-Delft/Gemeentelijk-Gegevensmodel
    ref: Voorbereidingen-Release-v2.5.1
    pad: v2.5.1/Gemeentelijk Gegevensmodel XMI2.1.xml
gemma:
  bron: 2026-vng-gemma-2026-10-02
  herkomst:                          # waar tools/gemma.py release het model ophaalt (AMEFF; .archimate kan als lokaal bestand)
    repository: VNG-Realisatie/GEMMA-Archi-repository
    ref: master
    pad: export/GEMMA release.xml

# Het kennismodel dat de export meeneemt: de elementen en relaties van deze views in de bron (Over GEMMA, AMEFF).
kennismodel:
  bron: 2026-vng-over-gemma
  views:
    - GEMMA kennismodel
    - GEMMA kennismodel bedrijfslaag
    - GEMMA kennismodel applicatielaag
    - GEMMA kennismodel technologielaag
    - GEMMA kennismodel strategie en motivatie
    - GEMMA kennismodel uitgebreid

# Woordbudget (llmwiki lint): per groep het maximum aan woorden. Een nieuwe regel of tekst gaat eerst naar de redacteur; pas daarna gaat het budget omhoog.
lint:
  woordbudget:
    AGENTS.md: 1740
    "kennismodel/**/*.md": 17100
    ".agents/skills/gemma-archimate-model-archimate-export/**/*.md": 1300
    ".agents/skills/gemma-archimate-model-beoordelen/**/*.md": 6750
    ".agents/skills/gemma-archimate-model-criteria/**/*.md": 950
    ".agents/skills/gemma-archimate-model-gemma-release/**/*.md": 520
    ".agents/skills/gemma-archimate-model-ggm-release/**/*.md": 490
    ".agents/skills/gemma-archimate-model-ingest/**/*.md": 1300
    ".agents/skills/gemma-archimate-model-update/**/*.md": 1700

work:
  retention_days: 30
