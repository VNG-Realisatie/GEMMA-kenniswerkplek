key: gemma-archimate-model
type: curation                       # sync | curation | knowledge-base

sources:
  tags: []                           # vast te stellen bij de eerste ingest
  exclude_tags: []

# Leesvolgorde op brontype (sources/index `brontype`); zie ARCHITECTURE.md §8.
# Brontype `model` (het GEMMA-model) is een matchdoel, geen bron voor begrippen.
bronvoorrang: [wet, informatiemodel, beleid, overig]

page_types:                          # pagina's van curated typen en onderwerpen maakt tools/render.py; zonder schema
  onderwerp:
    dir: begrippen                   # begrippenlijst per onderwerp (gegenereerd uit beoordelingen/onderwerpen)
  bronanalyse:
    dir: bronanalyses
    group_by: onderwerp
    schema: schemas/bronanalyse.schema.json
  analyse:
    dir: analyses
    schema: schemas/analyse.schema.json
  bedrijfsobject:                    # archimate_type business-object | contract
    dir: bedrijfsarchitectuur/bedrijfsobjecten
    submappen: [taakveld, beleidsdomein]
    curated: true
  product:
    dir: bedrijfsarchitectuur/producten
    submappen: [taakveld, beleidsdomein]
    curated: true
  dienst:                            # GEMMA-naam Dienst (Business Service)
    dir: bedrijfsarchitectuur/diensten
    submappen: [taakveld, beleidsdomein]
    curated: true
  bedrijfsproces:
    dir: bedrijfsarchitectuur/bedrijfsprocessen
    submappen: [taakveld, beleidsdomein]
    curated: true
  bedrijfsfunctie:
    dir: bedrijfsarchitectuur/bedrijfsfuncties
    submappen: [taakveld, beleidsdomein]
    curated: true
  gebeurtenis:                       # GEMMA-naam Gebeurtenis (Business Event)
    dir: bedrijfsarchitectuur/gebeurtenissen
    curated: true
  actor:
    dir: bedrijfsarchitectuur/actoren
    curated: true
  rol:
    dir: bedrijfsarchitectuur/rollen
    curated: true
  bedrijfssamenwerking:              # Business Collaboration, zonder eigen rechtspersoon
    dir: bedrijfsarchitectuur/bedrijfssamenwerkingen
    curated: true
  kanaal:                            # Business Interface; één centrale set
    dir: bedrijfsarchitectuur/kanalen
    curated: true
  beleidskader:                      # Driver (motivatielaag); rijks- of EU-regelgeving of VNG-modelverordening
    dir: motivatie/beleidskaders
    curated: true

curation:
  beoordelingen: beoordelingen/begrippen   # het oordeel van de AI per begrip (YAML); zie ARCHITECTURE.md
  afleiden: tools/afleiden.py              # type, status en modelvelden; daarna de render
  render: tools/render.py                  # alle pagina's uit de beoordelingen
  states: [kandidaat, review, goedgekeurd, afgewezen]
  gated: [goedgekeurd]
  approval: chat                     # AKKOORD in de chat na het bekijken van de pagina's (llmwiki promote plan/apply)
  min_reviewers: 1

# Actuele modelbronnen (bron-id's in sources/index), gezet door tools/ggm.py en tools/gemma.py `release`.
ggm:
  bron: 2026-vng-ggm-2-5-1
  herkomst:                          # waar tools/ggm.py release het XMI ophaalt (zelfde locatie als de vorige wiki)
    repository: Gemeente-Delft/Gemeentelijk-Gegevensmodel
    ref: Voorbereidingen-Release-v2.5.1
    pad: v2.5.1/Gemeentelijk Gegevensmodel XMI2.1.xml
gemma:
  bron: 2026-vng-gemma-2026-07-01
  herkomst:                          # waar tools/gemma.py release het model ophaalt (AMEFF; .archimate kan als lokaal bestand)
    repository: VNG-Realisatie/GEMMA-Archi-repository
    ref: master
    pad: export/GEMMA release.xml

work:
  retention_days: 30
