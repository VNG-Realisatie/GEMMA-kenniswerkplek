key: _template-md
type: curation                       # sync | curation | hybrid

sources:
  tags: []                           # welke thema-tags deze wiki uit sources/ mag zien
  exclude_tags: []

page_types:
  onderwerp:
    dir: onderwerpen
  bron:
    dir: bronnen
    group_by: onderwerp
  kandidaat:
    dir: kandidaten
    curated: true

curation:
