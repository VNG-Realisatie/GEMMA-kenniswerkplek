name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run llmwiki lint

      - name: Harness check
        run: uv run llmwiki harness check
